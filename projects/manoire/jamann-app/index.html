const CTA_EMOJIS = ['🏔️','🐾','✨','🤍','🍽️','📍','🔗','☀️','⛰️'];

function normalizeCaption(rawCaption, brand) {
  if (!rawCaption) return '';
  let txt = String(rawCaption);
  txt = txt.replace(/\\n/g, '\n');
  const urlPattern = /\s*[🏔️🐾✨🤍🍽️📍🔗☀️⛰️]?\s*(?:https?:\/\/)?(?:www\.)?lemanoire-jaman\.ch\/?/gu;
  txt = txt.replace(urlPattern, '');
  txt = txt.replace(/[—\-–]\s*L['']équipe\s+du\s+Manoïre[\s.!]*/gi, '');
  txt = txt.replace(/\n{3,}/g, '\n\n').trim();
  const emoji = CTA_EMOJIS[txt.length % CTA_EMOJIS.length];
  return `${txt}\n\n— L'équipe du Manoïre\n${emoji} ${brand.siteUrl}`;
}

function getCountdown(brand) {
  const today = new Date();
  const opening = new Date(brand.openingDate);
  const days = Math.max(0, Math.ceil((opening - today) / 86400000));
  const weeks = Math.round(days / 7);
  let human;
  if (days <= 0) human = "C'EST OUVERT (ne plus parler de compte à rebours)";
  else if (days <= 7) human = `J-${days} (cette semaine !)`;
  else if (days <= 14) human = `J-${days} (~${weeks} semaines, dernière ligne droite)`;
  else if (days <= 35) human = `J-${days} (~${weeks} semaines, environ 1 mois)`;
  else if (days <= 70) human = `J-${days} (~${weeks} semaines, environ 1 mois et demi à 2 mois)`;
  else if (days <= 100) human = `J-${days} (~${Math.round(days/30)} mois)`;
  else human = `J-${days} (~${Math.round(days/30)} mois)`;
  const todayFr = today.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  return { days, weeks, human, todayFr };
}

# CONTEXTE — LE MANOÏRE
<contexte_marque>
## Identité & âme du lieu
- **Établissement** : Le Manoïre — restaurant d'alpage historique au Col de Jaman, 1512m, au-dessus de Montreux (Vaud, Suisse). Dans le Parc naturel régional Gruyère Pays-d'Enhaut.
- **Tagline** : *"Au-dessus du lac, au-dessus du bruit, au-dessus du temps."*
- **Philosophie** : *"Transmettre plutôt que conceptualiser. Pas pour une saison. Pour des décennies."*

## Chronologie — une mémoire à convoquer
- **1900** : Une fromagerie d'alpage est bâtie en madriers de mélèze. La Société des Alpages de Jaman produit le fromage depuis cette époque.
- **Années 40** : Ruth et Fred Buser la transforment en café-restaurant légendaire — halte des randonneurs et des Montreusians.
- **Années 2010** : Le chef étoilé Michelin **Frédéric Médigue** y signe une cuisine raffinée de terroir.
- **2023** : Bâtiment déclaré impropre. Food truck à l'extérieur deux ans. Le chalet attend.
- **2024** : **Michaël "Micka" Moreau** (ex-maître de salle aux Trois Sifflets, Vevey) remporte l'appel d'offres communal. Vote : 72-0-1. Usufruit 40 ans pour 1 CHF symbolique.
- **Juin 2026** : Retour au nom originel **Le Manoïre**. Renaissance complète. Pour des décennies.

## Cadre sensoriel
- **Le train MOB rouge** : crémaillère depuis Montreux — on entend la mécanique résonner avant d'arriver.
- **Double panorama** : côté nord — lac Léman et Riviera vaudoise. Côté sud — vallée de la Gruyère, Préalpes.
- **Lumière & saisons** : brume matinale sur le Léman, narcisses en mai-juin, sommets enneigés des Dents du Midi, soleil rasant qui dore les cimes, désalpe en automne.
- **Sons & odeurs** : sonnailles des vaches (tintement métallique), feu de bois, mélèze fraîchement travaillé.
- **Le bâtiment** : chalet en madriers de mélèze centenaires. 80 places salle + 80 terrasse.

## Randonnées (détails précis pour tes textes)
- **Dent de Jaman** (1875m) : forme de canine visible depuis la Riviera. Sentier derrière le restaurant, chaînes sur sections exposées. Vue 360°.
- **Rochers de Naye** (2042m) : grande traversée. Parc de marmottes, grottes de Naye. Vue plongeante sur le Léman.
- **Circuit Les Avants → Col de Jaman → Rochers de Naye** : 8km, +1175m, T2. Le col = étape centrale, halte naturelle.
- **Les randonneurs** : familles, marcheurs aguerris, touristes — tous arrivent au col les jambes chargées, joues rouges, souffle court.
- **Fromagerie voisine** : 2000+ visiteurs/an, fromage de Jaman depuis 1944.

## Cuisine & terroir
- Tomme fraîche d'alpage, raclette au feu de bois, rösti montagnard, fondue maison
- Producteurs locaux suisses — connus de Micka
- Menu ardoise, renouvelé selon saison, prix raisonnables
- Cuisine de partage et de halte — généreuse, sans chichis

## Mascotte — Anouck
- Femelle Saint-Bernard, au col depuis ses 2 mois. Son maître = Micka.
- Fil rouge émotionnel du compte — présence naturelle, jamais forcée.
- Fréquence : 1 post sur 2 la contient — ni plus, ni moins.
- Elle apparaît avec un rôle fictif léger : "chef inspectrice", "responsable de l'accueil", "première cliente".
- Humour vient du décalage — jamais d'anthropomorphisme poussé, jamais de dialogues inventés.
- Toujours associée à une vraie photo (pas d'illustration).

## Contexte saisonnier — Été 2026
- Ouverture fin juin : célébration, terrasse, plein soleil, vue lac.
- Montreux Jazz Festival (début juillet) — le Col est à 20 min de Montreux, à mentionner en contexte.
- Posts "vue du soir" avec coucher de soleil sur le Léman.
- Premiers randonneurs, premières tables servies en terrasse.

## Canaux officiels
- Site web : ${siteUrl} | Instagram : @${brand.ig} | Facebook : ${brand.fb}

# CHARTE ÉDITORIALE & VOIX DE MARQUE
<charte_editoriale>
## 1. Style "Escalier"
- Phrases courtes, rythmées. Paragraphes très aérés (3 lignes max).
- Ton : chaleureux, authentique, humble, poétique mais sobre. Jamais mondain, mercantile, corporatif.
- Humour tendre uniquement dans les posts avec Anouck.

## 2. Garde-fous lexicaux
- **AUTORISÉS & ENCOURAGÉS** : terroir, alpage, transmission, racines, halte, retour, hauteur, lenteur, simplicité, partage, marcheurs, sentier, randonnée.
- **BANNIS — NE JAMAIS UTILISER** : magnifique, incroyable, exceptionnel, unique en son genre, inoubliable, magique, tendance, food, expérience client, communauté, lifestyle, gourmet, premium, savoureux.
- Toujours évoquer le cadre montagnard (col, altitude, montagne, Alpes, cimes) au moins une fois.

## 3. Emojis
- 2 à 4 maximum par post. Intégrés dans le texte, jamais en chapelet de fin.
- Emojis validés : 🏔️ 🐾 🧀 🍷 ☀️ 🤍 🔨 📅 ✨

## 4. CTA & Signature
- CTA autorisés : "Suivez l'aventure", "On vous attend là-haut", "Plus d'infos sur le projet", "Toutes les infos sur lemanoire-jaman.ch".
- INTERDIT : "Réservez maintenant", "Commandez", "Venez ce week-end".
- Chaque post DOIT se terminer par :

  — L'équipe du Manoïre
  [emoji_unique] ${siteUrl}

  (L'URL inclut le protocole https://)
</charte_editoriale>

# ⚠️ ANTI-RÉPÉTITIVITÉ — RÈGLE CRITIQUE
<regles_anti_repetitivite>
1. **INTERDIT** — ces accroches sont usées, ne jamais les réutiliser :
   - "Il y a des retours qui ressemblent..."
   - "Il y a des endroits qui font du bien..."
   - "Les marteaux sont sortis..."
   - "À 1500m d'altitude, on ne plaisante pas..."
   - "Le Col de Jaman, c'est..."
   - "Au cœur de l'alpage..."

2. **STRUCTURES À ALTERNER** — changer radicalement de structure à chaque génération :
   - **Sensorielle** : un son précis (tintement cloches, sifflet MOB), une odeur (mélèze, feu de bois), une sensation physique.
   - **Anecdote randonneur** : chaussures poussiéreuses sur la terrasse, souffle court au col, joues rouges.
   - **Temporelle / météo** : brume sur le Léman, soleil rasant sur les cimes, premier gel d'octobre.
   - **Question poétique** : interrogation sur la lenteur, le retour aux sources, ce qu'est une halte.
   - **Action directe** : Anouck qui fait une escapade, le MOB rouge qui siffle, Micka qui pose un outil.
   - **Chiffre ou date** : "1900.", "8km.", "80 places.", une mesure précise qui ancre immédiatement.

3. **SPÉCIFICITÉ** : Un moment précis, un instant de vie — pas une présentation générale.
</regles_anti_repetitivite>

function buildUserPrompt(pillar, cd, idea, brand) {

    ? `Brief : "${idea.trim()}"`
    : `Pas de brief précis — génère une variation libre et inédite sur ce pilier.`;

  return `## BRIEF DE GÉNÉRATION

Date du jour : ${cd.todayFr}
Statut ouverture : ${cd.human}
${cd.days <= 0 ? 'LE RESTAURANT EST OUVERT — les CTA "ouverture bientôt" ne s\'appliquent plus.' : ''}

Pilier actif : ${pillar.label}
Angle : ${pillar.angle}
Vocabulaire à privilégier : ${pillar.vocab}

// ─── RESPONSIVE HOOK ─────────────────────────────────────────────────────────
function useIsDesktop(bp = 1024) {
  const q = `(min-width: ${bp}px)`;
  const [is, set] = React.useState(() => typeof window !== 'undefined' && window.matchMedia(q).matches);
  React.useEffect(() => {
    const mq = window.matchMedia(q);
    const fn = e => set(e.matches);
    mq.addEventListener('change', fn);
    return () => mq.removeEventListener('change', fn);
  }, [q]);
  return is;
}

  const [idea, setIdea]       = React.useState('');
  const [pillar, setPillar]   = React.useState(PILLARS[0].id);
  const [loading, setLoading] = React.useState(false);
  const [result, setResult]   = React.useState(generatedPost);
  const [copied, setCopied]   = React.useState(null);
  const [error, setError]     = React.useState(null);
  const fileRef = React.useRef(null);
  const desktop = useIsDesktop();

  const handleImage = e => {
    const f = e.target.files[0];
    if (f) setImagePreview(URL.createObjectURL(f));
  };

  const handleGenerate = async () => {
    setLoading(true);
    setResult(null);
    setError(null);
    const { systemPrompt, userPrompt } = buildAIPrompt(pillar, idea, brand);
    try {
      let raw;
      if (typeof window.claude?.complete === 'function') {
        raw = await window.claude.complete(systemPrompt + '\n\n---\n\n' + userPrompt);
      } else {
        const r = await fetch('/api/claude', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ systemPrompt, userPrompt }),
        });
        const j = await r.json();
        if (!r.ok || j.error) {
          const detail = j.detail?.error?.message || j.detail?.message || JSON.stringify(j.detail || {});
          throw new Error(`${j.error || 'HTTP '+r.status} — ${detail}`);
        }
        raw = j.text;
      }
      const cleaned = raw.trim().replace(/^```json?\s*/i, '').replace(/```\s*$/, '');
      const data    = JSON.parse(cleaned);
      if (!data.instagram || !data.facebook) throw new Error('Réponse IA mal formée (manque instagram ou facebook)');
      data.instagram.caption = normalizeCaption(data.instagram.caption, brand);
      data.facebook.caption  = normalizeCaption(data.facebook.caption,  brand);
      setResult(data);
      setGeneratedPost(data);
    } catch (e) {
      console.error('[Jamann] Génération IA échouée :', e);
      const activePillar = PILLARS.find(p => p.id === pillar) || PILLARS[0];
      const fallback = {
        instagram: {
          caption: normalizeCaption(`Au Col de Jaman, le temps ralentit.\nLe Manoïre se prépare. 🏔️\nFin juin 2026, on vous attend.`, brand),

                    <div style={{ position:'absolute', top:0, left:0, right:0, height:3, background:'linear-gradient(90deg, #E8C060, #C4923E)', zIndex:2 }} />

                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Input card */}
        <div style={{
          background:T.surface, borderRadius:22,
          padding:18,
          border:`1px solid rgba(232,192,96,0.22)`,
          boxShadow:`0 0 0 1px rgba(232,192,96,0.08), 0 8px 40px rgba(0,0,0,0.55)`,
          backdropFilter:'blur(16px)',
          WebkitBackdropFilter:'blur(16px)',
        }}>
          {/* Mode toggle */}
          <div style={{ display:'flex', gap:3, background:T.surface2, borderRadius:13, padding:3, marginBottom:14 }}>
            {[{id:'text',l:'💬 Idée (optionnel)'},{id:'image',l:'📸 Photo'}].map(m => (
              <button
                key={m.id}
                onClick={() => setMode(m.id)}
                style={{
                  flex:1, padding:'8px 0', textAlign:'center',
                  fontFamily:'inherit', fontSize:13, fontWeight:600,
                  borderRadius:10, border:'none', cursor:'pointer',
                  background: mode===m.id ? T.surface : 'transparent',
                  color: mode===m.id ? T.text : T.textSub,
                  boxShadow: mode===m.id ? '0 1px 4px rgba(0,0,0,0.1)' : 'none',
                  transition:'all 0.15s',
                }}
              >
                {m.l}
              </button>
            ))}
          </div>

          {mode === 'text' ? (
            <textarea
              value={idea}
              onChange={e => setIdea(e.target.value)}
              placeholder="Optionnel — précise l'angle si tu as une idée précise (ex: semaine 3 de travaux, on a démoli le mur du fond / Anouck a piqué un croissant au maçon / le fromager d'Ormonts vient livrer demain). Sinon, laisse vide et le pilier suffit."
              style={{
                width:'100%', minHeight:100,
                background:T.inputBg,
                border:`1.5px solid ${T.border}`,
                borderRadius:14,
                padding:'12px 14px',
                color:T.text, fontSize:14, lineHeight:1.6,
                resize:'none', fontFamily:'inherit',
                transition:'border-color 0.15s',
              }}
            />
          ) : (
            <>
              <div
                onClick={() => fileRef.current?.click()}
                style={{
                  height:130, background:T.inputBg,
                  border:`1.5px dashed ${T.border}`,
                  borderRadius:14,
                  display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center',
                  gap:9, cursor:'pointer', overflow:'hidden', position:'relative',
                }}
              >
                {imagePreview
                  ? <img src={imagePreview} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                  : (
                    <>
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="1.5" strokeLinecap="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.5" cy="8.5" r="1.5" fill={T.textMuted} stroke="none"/>
                        <path d="M21 15l-5-5L5 21" strokeLinejoin="round"/>
                      </svg>
                      <p style={{ fontSize:13, color:T.textSub }}>Appuyer pour ajouter une photo</p>
                    </>
                  )
                }
                <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImage} />
              </div>
              <textarea
                value={idea}
                onChange={e => setIdea(e.target.value)}
                placeholder="Contexte (optionnel)…"
                style={{
                  width:'100%', minHeight:60, marginTop:10,
                  background:T.inputBg, border:`1.5px solid ${T.border}`,
                  borderRadius:12, padding:'10px 14px',
                  color:T.text, fontSize:13, lineHeight:1.55,
                  resize:'none', fontFamily:'inherit',
                }}
              />
            </>
          )}
          <p style={{ fontSize:11, color:T.textMuted, marginTop:10, fontStyle:'italic', lineHeight:1.5 }}>
            IG : 200–350 car. · 8–10 hashtags &nbsp;·&nbsp; FB : 300–600 car. · 5 hashtags exacts
          </p>
        </div>

        {/* Generate button */}
        <button
          onClick={handleGenerate}
          disabled={loading}
          className={loading ? '' : 'btn-generate btn-press btn-gold-glow'}
          style={{
            width:'100%', padding:'20px',
            borderRadius:18, border:'none',
            background: loading ? T.surface2 : T.accentGrad,
            color: loading ? T.textMuted : T.btnText,
            fontSize:18, fontWeight:700,
            cursor: loading ? 'default' : 'pointer',
            fontFamily:"'Fraunces', serif",
            fontStyle: loading ? 'normal' : 'italic',
            letterSpacing:'-0.1px',
            boxShadow: loading ? 'none' : '0 6px 32px rgba(232,192,96,0.35)',
            transition:'background 0.15s, color 0.15s, box-shadow 0.15s',
          }}
        >
          ✦ Générer les 2 posts
        </button>

        {loading && <Spinner T={T} />}

        {!loading && error && <ErrorBanner T={T} message={error} />}

        {/* Results */}
        {!loading && result && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ display:'flex', gap:14, flexDirection: desktop ? 'row' : 'column' }}>
              <div className="card-reveal-1" style={{ flex:1, minWidth:0 }}>
                <PostCard T={T} platform="instagram" data={result.instagram} brand={brand} copied={copied} onCopy={handleCopy} />
              </div>
              <div className="card-reveal-2" style={{ flex:1, minWidth:0 }}>
                <PostCard T={T} platform="facebook"  data={result.facebook}  brand={brand} copied={copied} onCopy={handleCopy} />
              </div>
            </div>
            {result.visual_tip && (
              <div style={{
                padding:'12px 16px',
                background:T.surface, borderRadius:13,
                border:`1px solid ${T.border}`,
                borderLeft:`3px solid ${T.accentBorder}`,
              }}>
                <p style={{ fontSize:12, color:T.textSub, fontStyle:'italic', lineHeight:1.55 }}>
                  <span style={{ fontStyle:'normal', marginRight:5 }}>💡</span>{result.visual_tip}
                </p>
              </div>
            )}
            <button
              onClick={onGoPreview}
              style={{
                padding:'13px', borderRadius:14,
                fontFamily:'inherit', border:`1.5px solid ${T.accentBorder}`,
                background:T.chipActive, color:T.accentSoft,
                fontSize:13, fontWeight:700, cursor:'pointer',
                transition:'all 0.15s',
              }}
            >
              Aperçu sur mockup →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CALENDAR SCREEN ──────────────────────────────────────────────────────────
function CalendarScreen({ T, onNewPost }) {
  const [selected, setSelected] = React.useState(null);
  const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const DAYS   = ['L','M','M','J','V','S','D'];
  const now    = new Date();
  const m = now.getMonth(), y = now.getFullYear(), today = now.getDate();
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInM  = new Date(y,m+1,0).getDate();
  const cells    = [...Array(firstDow).fill(null), ...Array.from({length:daysInM},(_,i)=>i+1)];
  const postMap  = Object.fromEntries(SAMPLE_POSTS.map(p=>[p.day,p]));
  const platColor = p => p === 'instagram' ? T.accent : '#1877F2';

  return (
    <div style={{ background:T.bg, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'28px 24px 14px' }}>
        <p className="font-fraunces" style={{ fontSize:32, fontWeight:800, color:T.text, letterSpacing:'-0.3px' }}>
          Calendrier
        </p>
        <p style={{ fontSize:14, color:T.textSub, marginTop:5 }}>Vue d'ensemble des publications planifiées</p>
      </div>

      {/* Demo banner */}
      <div style={{ margin:'0 20px 16px', padding:'12px 16px', background:T.surface, borderRadius:14, borderLeft:`3px solid ${T.accentBorder}`, border:`1px solid ${T.border}`, borderLeft:`3px solid ${T.accentBorder}`, display:'flex', gap:12, alignItems:'flex-start' }}>
        <span style={{ fontSize:15, lineHeight:1.2 }}>🚧</span>
        <div style={{ flex:1 }}>
          <p style={{ fontSize:12, color:T.accentSoft, fontWeight:700 }}>Module en démo</p>
          <p style={{ fontSize:11, color:T.textSub, marginTop:3, lineHeight:1.5 }}>
            Les posts ci-dessous sont des exemples. Le calendrier sera connecté à Airtable (<code>tblqLY0hmMINANI9s</code>) + scénario Make 5469302.
          </p>
        </div>
      </div>

      <div style={{ padding:'0 20px 32px' }}>
        {/* Calendar card */}
        <div style={{ background:T.surface, borderRadius:22, padding:'16px 14px', border:`1px solid ${T.border}`, boxShadow:T.shadow, marginBottom:18 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 4px', marginBottom:16 }}>
            <button style={{ width:32, height:32, borderRadius:'50%', background:T.chipBg, border:`1px solid ${T.border}`, color:T.textSub, fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'background 0.15s' }}>‹</button>
            <span className="font-fraunces" style={{ fontSize:17, fontWeight:700, color:T.text }}>{MONTHS[m]} {y}</span>
            <button style={{ width:32, height:32, borderRadius:'50%', background:T.chipBg, border:`1px solid ${T.border}`, color:T.textSub, fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'background 0.15s' }}>›</button>
          </div>
          {/* Day headers */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3, marginBottom:6 }}>
            {DAYS.map((d,i) => <div key={i} className="label-caps" style={{ textAlign:'center', color:T.textMuted, padding:'2px 0' }}>{d}</div>)}
          </div>
          {/* Day cells */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3 }}>
            {cells.map((d,i) => {
              const isT = d===today, post=d?postMap[d]:null, sel=d===selected;
              return (
                <div
                  key={i}
                  onClick={() => d && setSelected(sel?null:d)}
                  style={{
                    aspectRatio:'1', borderRadius:8, cursor:d?'pointer':'default',
                    background: sel ? T.accent : isT ? T.accentBg : d ? 'rgba(255,255,255,0.05)' : 'transparent',
                    border: d
                      ? (sel ? '2px solid transparent' : isT ? `2px solid ${T.accentBorder}` : '1px solid rgba(255,255,255,0.10)')
                      : 'none',
                    display:'flex', flexDirection:'column',
                    alignItems:'center', justifyContent:'center', gap:3,
                    transition:'all 0.15s',
                  }}
                >
                  {d && <span style={{ fontSize:12, fontWeight:isT||sel?700:400, color:sel?'#fff':isT?T.accentSoft:T.text, lineHeight:1 }}>{d}</span>}
                  {post && <div style={{ width:5, height:5, borderRadius:'50%', background:sel?'rgba(255,255,255,0.8)':platColor(post.platform) }} />}
                </div>
              );
            })}
          </div>
        </div>

        {/* Post list */}
        <p className="label-caps" style={{ color:T.textMuted, marginBottom:12 }}>Posts planifiés (exemples)</p>
        {SAMPLE_POSTS.map((p,i) => (
          <div
            key={i}
            onClick={() => setSelected(p.day===selected?null:p.day)}
            style={{
              display:'flex', alignItems:'center', gap:14,
              padding:'13px 16px',
              background: selected===p.day ? T.chipActive : T.surface,
              borderRadius:16, marginBottom:9,
              border:`1px solid ${selected===p.day ? T.chipActiveBorder : T.border}`,
              borderLeft:`4px solid ${platColor(p.platform)}`,
              cursor:'pointer',
              transition:'all 0.17s',
              boxShadow: selected===p.day ? T.shadow : 'none',
            }}
          >
            <div style={{ width:42, height:42, borderRadius:13, background:T.surface2, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <span className="font-fraunces" style={{fontSize:15,fontWeight:800,color:T.text,lineHeight:1}}>{p.day}</span>
              <span style={{fontSize:10,color:T.textMuted,letterSpacing:'0.03em'}}>{MONTHS[m].slice(0,3).toUpperCase()}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:13,fontWeight:600,color:T.text,lineHeight:1.3}}>{p.label}</p>
              <p style={{fontSize:11,color:platColor(p.platform),fontWeight:600,marginTop:3}}>
                {p.platform==='instagram'?'📸 Instagram':'👥 Facebook'}
              </p>
            </div>
          </div>
        ))}

        <button
          onClick={onNewPost}
          style={{
            width:'100%', padding:'14px', marginTop:6,
            borderRadius:16,
            border:`1.5px dashed ${T.accentBorder}`,
            background:T.chipActive, color:T.accentSoft,
            fontSize:14, fontWeight:700,
            cursor:'pointer', fontFamily:'inherit',
            transition:'all 0.15s',
          }}
        >
          ✦ Générer un nouveau post
        </button>
      </div>
    </div>
  );
}

        width:256, zIndex:30,
        background:'rgba(6,8,21,0.97)',
        borderRight:`1px solid rgba(255,255,255,0.08)`,
        backdropFilter:'blur(20px)',
        WebkitBackdropFilter:'blur(20px)',
        display:'flex', flexDirection:'column',
        padding:'0 0 24px',
      }}>
        {/* Brand section */}
        <div style={{ padding:'28px 20px 24px', borderBottom:'1px solid rgba(255,255,255,0.08)', marginBottom:8 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:14 }}>
            <img src="logo.png" alt="Logo Le Manoïre" style={{ width:44, height:44, objectFit:'contain', borderRadius:8, flexShrink:0 }} />
            <div>
              <p className="font-fraunces" style={{ fontSize:24, fontWeight:800, color:'#FFFFFF', letterSpacing:'-0.3px', lineHeight:1.1 }}>
                Jamann <span style={{color:'#E8C060', fontSize:20}}>✦</span>
              </p>
              <p style={{ fontSize:11, color:'rgba(255,255,255,0.55)', marginTop:2 }}>Posts IA · Le Manoïre</p>
            </div>
          </div>
          <div style={{ padding:'8px 10px', background:'rgba(232,192,96,0.14)', border:'1px solid rgba(232,192,96,0.25)', borderRadius:8 }}>
            <p style={{ fontSize:11, color:'#E8C060', fontWeight:600, lineHeight:1.4 }}>
              Restaurant d'alpage · Col de Jaman · 1512m
            </p>
          </div>
        </div>

        {/* Nav items */}
        <div style={{ padding:'4px 12px', flex:1 }}>
          {tabs.map(tab => {
            const on = active === tab.id;
            return (
              <button
                key={tab.id}
                onClick={() => setActive(tab.id)}
                style={{
                  width:'100%', textAlign:'left',
                  fontFamily:'inherit', cursor:'pointer',
                  display:'flex', alignItems:'center', gap:12,
                  padding:'12px 14px',
                  borderRadius:12, marginBottom:4,
                  background: on ? 'rgba(232,192,96,0.14)' : 'transparent',
                  border:`1px solid ${on ? 'rgba(232,192,96,0.30)' : 'transparent'}`,
                  transition:'all 0.17s cubic-bezier(0.16, 1, 0.3, 1)',
                }}
              >
                {tab.icon(on)}
                <span style={{ fontSize:14, fontWeight:700, color: on ? '#E8C060' : 'rgba(255,255,255,0.72)' }}>{tab.l}</span>
                {on && <span style={{ marginLeft:'auto', width:6, height:6, borderRadius:'50%', background:'#E8C060', flexShrink:0 }} />}
              </button>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{ padding:'16px 20px 4px', borderTop:'1px solid rgba(255,255,255,0.08)', marginTop:4 }}>
          <p style={{ fontSize:11, color:'rgba(255,255,255,0.25)', lineHeight:1.65 }}>
            © 2026 · Conçu par<br/>
            <span className="font-caveat" style={{ color:'rgba(255,255,255,0.65)', fontSize:20, fontWeight:600, lineHeight:1.3 }}>L'Atelier des Automates</span><br/>
            <span style={{ color:'rgba(255,255,255,0.22)', fontSize:10 }}>une branche de Clockwork Ops</span>
          </p>
        </div>
      </aside>
    );
  }

  // Mobile tab bar — dark premium
  return (
    <nav style={{
      position:'fixed', bottom:0, left:0, right:0, zIndex:30,
      background:'rgba(6,8,21,0.96)',
      borderTop:'1px solid rgba(232,192,96,0.22)',
      backdropFilter:'blur(24px)',
      WebkitBackdropFilter:'blur(24px)',
      display:'flex', justifyContent:'space-around',
      padding:'10px 0 24px',
    }}>
      {tabs.map(tab => {
        const on = active === tab.id;
        return (
          <button
            key={tab.id}
            onClick={() => setActive(tab.id)}
            style={{
              background:'none', border:'none', cursor:'pointer',
              display:'flex', flexDirection:'column', alignItems:'center',
              gap:4, padding:'4px 14px', fontFamily:'inherit',
              transition:'opacity 0.15s',
            }}
          >
            {tab.icon(on)}
            <span style={{ fontSize:10, fontWeight:700, color: on ? '#FFFFFF' : 'rgba(255,255,255,0.45)' }}>{tab.l}</span>
            {on && <span style={{ width:16, height:2, borderRadius:1, background:'#E8C060', marginTop:1 }} />}
          </button>
        );
      })}
    </nav>
  );
}

// ─── MOBILE HEADER ─────────────────────────────────────────────────────────────
function MobileHeader({ T }) {
  return (
    <div
      className="fade-in"
      style={{
        position:'sticky', top:0, zIndex:20,
        display:'flex', alignItems:'center',
        padding:'14px 18px 14px',
        background:'rgba(6,8,21,0.94)',
        borderBottom:'1px solid rgba(255,255,255,0.08)',
        backdropFilter:'blur(20px)',
        WebkitBackdropFilter:'blur(20px)',
        marginBottom:14,
        gap:14,
      }}
    >
      <img src="logo.png" alt="Logo Le Manoïre" style={{ height:40, width:'auto', flexShrink:0 }} />
      <div style={{ borderLeft:'2px solid rgba(255,255,255,0.15)', paddingLeft:14 }}>
        <p className="font-fraunces" style={{ fontSize:22, fontWeight:800, color:'#FFFFFF', letterSpacing:'-0.3px', lineHeight:1.1 }}>
          Jamann <span style={{color:'#E8C060'}}>✦</span>
        </p>
        <p style={{ fontSize:11, color:'rgba(255,255,255,0.55)', marginTop:2 }}>Posts IA · Le Manoïre</p>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function JamannApp() {
  const T                     = THEMES.manoire;
  const desktop               = useIsDesktop();
  const [tab, setTab]         = React.useState('create');
  const [post, setPost]       = React.useState(null);
  const [imgPrev, setImgPrev] = React.useState(null);

  const shared = { T, brand:BRAND, generatedPost:post, setGeneratedPost:setPost, imagePreview:imgPrev, setImagePreview:setImgPrev };

  return (
    <div style={{
      width:'100%', minHeight:'100vh',
      background:'#060815',
      fontFamily:"'DM Sans', sans-serif",
      WebkitFontSmoothing:'antialiased',
      MozOsxFontSmoothing:'grayscale',
    }}>
      <StarryBackground />
      {!desktop && <MobileHeader T={T} />}
      <main className="fade-in" style={{
        paddingLeft: desktop ? 256 : 0,
        paddingBottom: desktop ? 48 : 96,
        paddingTop: desktop ? 40 : 8,
        minHeight:'100vh',
        position:'relative', zIndex:1,
      }}>
        <div style={{ maxWidth:1000, margin:'0 auto', padding: desktop ? '0 40px' : '0 16px' }}>
          {tab==='create'   && <div className="slide-up"><CreateScreen   {...shared} onGoPreview={()=>setTab('preview')} /></div>}
          {tab==='preview'  && <div className="slide-up"><PreviewScreen  {...shared} onSchedule={()=>setTab('calendar')} /></div>}
          {tab==='calendar' && <div className="slide-up"><CalendarScreen T={T} onNewPost={()=>setTab('create')} /></div>}
          {tab==='profile'  && <div className="slide-up"><ProfileScreen  T={T} brand={BRAND} /></div>}
        </div>
      </main>
      <TabBar T={T} active={tab} setActive={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<JamannApp />);
</script>
</body>
</html>
