<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Le Manoïre — Studio Posts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <style>
    :root {
      --bg:    #2d6a4f;
      --surf:  rgba(35,88,65,.96);
      --surf2: rgba(28,74,55,.88);
      --grn:   #a0f0c0;
      --grn2:  #c8fce0;
      --gb:    rgba(160,240,192,.12);
      --gb2:   rgba(160,240,192,.2);
      --gld:   #ffd700;
      --gob:   rgba(255,215,0,.12);
      --gob2:  rgba(255,215,0,.22);
      --bdr:   rgba(160,240,192,.12);
      --bdr2:  rgba(160,240,192,.28);
      --tx:    #f0fff4;
      --mu:    rgba(240,255,244,.55);
      --di:    rgba(240,255,244,.3);
      --blue:  #93c5fd;
      --rose:  #f9a8d4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg); color: var(--tx);
      overflow-x: hidden;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    * { scrollbar-width: thin; scrollbar-color: rgba(160,240,192,.15) transparent; }

    /* ── Aurora — blobs plus clairs que le fond pour profondeur visible ── */
    .aurora {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 85% 65% at 15% 15%, rgba(55,120,80,.5) 0%, transparent 60%),
        radial-gradient(ellipse 65% 55% at 85% 85%, rgba(20,90,55,.35) 0%, transparent 60%),
        radial-gradient(ellipse 45% 40% at 55% 50%, rgba(255,215,0,.07) 0%, transparent 70%),
        var(--bg);
      animation: aushift 22s ease-in-out infinite alternate;
    }
    @keyframes aushift {
      from { background-position: 0% 0%, 100% 100%, 50% 50%; }
      to   { background-position: 3% -4%, 97% 104%, 53% 47%; }
    }
    .grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .14;
      background-image:
        linear-gradient(rgba(160,240,192,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160,240,192,.07) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── App shell ── */
    .app-root { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--bdr);
      background: rgba(25,65,45,.94);
      backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
      position: sticky; top: 0; z-index: 50; flex-shrink: 0;
    }
    .brand     { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 800; color: var(--tx); line-height: 1; }
    .brand-sub { font-size: 10px; color: var(--di); margin-top: 2px; font-weight: 600; }
    .topnav    { display: none; gap: 4px; margin-left: auto; }
    .tnav {
      padding: 7px 14px; border-radius: 10px; border: 1px solid transparent;
      font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700;
      cursor: pointer; background: transparent; color: var(--mu);
      transition: all .2s; position: relative;
    }
    .tnav.on { background: var(--gb); color: var(--grn); border-color: var(--bdr2); }
    .tnav:hover:not(.on) { background: var(--gb); color: var(--mu); }
    .tnav:active { transform: scale(.92); }
    .tnav-dot {
      position: absolute; top: 6px; right: 8px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gld); box-shadow: 0 0 8px rgba(255,215,0,.7);
      animation: tdot 2s ease-in-out infinite;
    }
    @keyframes tdot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.6);opacity:.5} }
    .jxchip {
      padding: 5px 14px; border-radius: 20px; flex-shrink: 0;
      background: var(--gob); border: 1px solid var(--gob2);
      font-size: 15px; font-weight: 800; color: var(--gld);
    }

    /* ── Main body ── */
    .main-body { display: flex; flex: 1; min-height: 0; }
    .lpanel {
      width: 100%; flex-direction: column;
      overflow-y: auto; padding: 22px 18px 100px;
    }
    .rpanel { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 22px 22px 40px; }

    /* ── Desktop ≥900px ── */
    @media (min-width: 900px) {
      .main-body  { height: calc(100vh - 58px); overflow: hidden; }
      .lpanel     { width: 440px; flex-shrink: 0; border-right: 1px solid var(--bdr); padding: 28px 28px 40px; overflow-y: auto; display: flex !important; flex-direction: column !important; }
      .rpanel     { display: flex !important; flex: 1; padding: 28px 36px 40px; }
      .mob-tabbar { display: none; }
      .topnav     { display: flex; }
    }

    /* ── Screen animation ── */
    .screen { display: flex; flex-direction: column; gap: 18px; flex: 1; animation: scin .5s cubic-bezier(.16,1,.3,1) both; }
    @keyframes scin  { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    @keyframes scout { from{opacity:1;transform:none} to{opacity:0;transform:translateY(-20px)} }
    .screen.leaving  { animation: scout .3s cubic-bezier(.4,0,1,1) both; pointer-events:none; }
    .caps  { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: var(--di); }
    .shead { display: flex; align-items: center; gap: 10px; }
    .hline { flex: 1; height: 1px; background: var(--bdr); }

    /* ── Cockpit ── */
    .cockpit {
      border-radius: 20px; background: var(--surf); border: 1px solid var(--bdr);
      display: flex; align-items: center; gap: 20px;
      position: relative; overflow: hidden; padding: 22px 24px;
    }
    .cockpit::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--gld) 50%, transparent 100%);
      opacity: .7;
    }
    .ck-mtn { position: absolute; inset: 0; pointer-events: none; opacity: .09; }
    .ck-num {
      font-size: 56px; font-weight: 800; color: var(--gld);
      line-height: 1; letter-spacing: -.04em; position: relative; z-index: 1;
      animation: goldglow 4s ease-in-out infinite;
    }
    @keyframes goldglow {
      0%,100%{ text-shadow: 0 0 28px rgba(255,215,0,.35); }
      50%    { text-shadow: 0 0 60px rgba(255,215,0,.7), 0 0 120px rgba(255,215,0,.22); }
    }
    .ck-sub  { font-size: 11px; color: var(--mu); margin-top: 4px; font-weight: 500; position: relative; z-index: 1; }
    .ck-div  { width: 1px; height: 52px; background: rgba(160,240,192,.18); flex-shrink: 0; position: relative; z-index: 1; }
    .ck-r    { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 1; }
    .ck-date { font-size: 12px; color: var(--mu); font-weight: 500; }
    .ck-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--gb); border: 1px solid var(--bdr2); color: var(--grn); }

    /* ── Pillar grid ── */
    .pgrid  { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .pcard  { border-radius: 14px; cursor: pointer; overflow: hidden; background: var(--surf2); border: 1px solid var(--bdr); transition: box-shadow .2s, background .2s; }
    .pcard:hover { background: var(--surf); box-shadow: 0 8px 26px rgba(0,0,0,.35); }
    .pcard.sel   { background: var(--surf); box-shadow: 0 0 24px rgba(160,240,192,.14); }

    /* Image header des cartes piliers */
    .pc-img { height: 80px; overflow: hidden; position: relative; }
    .pc-img img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.85) saturate(1.1); }
    .pc-img::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,transparent 40%,rgba(28,74,55,.88)); }

    /* Fallbacks CSS si l'image ne charge pas */
    .pg-travaux   { background: linear-gradient(135deg,#5c2a0e 0%,#c45a20 55%,#e8a030 100%); }
    .pg-anouck    { background: linear-gradient(135deg,#1c4040 0%,#4a9080 55%,#c0d8c0 100%); }
    .pg-terroir   { background: linear-gradient(135deg,#143c18 0%,#3a8030 55%,#a8d050 100%); }
    .pg-lieu      { background: linear-gradient(135deg,#0a1c3c 0%,#1860a0 55%,#60b8e8 100%); }
    .pg-histoire  { background: linear-gradient(135deg,#2e1a0a 0%,#7c5030 55%,#c8a060 100%); }
    .pg-countdown { background: linear-gradient(135deg,#401008 0%,#a03020 55%,#e87030 100%); }

    .pc-body { padding: 10px 12px 12px; }
    .pc-top  { display: flex; align-items: flex-start; justify-content: flex-end; margin-bottom: 5px; }
    .pc-code { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--di); }
    .pc-chk  { width: 15px; height: 15px; border-radius: 50%; background: var(--gb); border: 1.5px solid var(--bdr2); display: flex; align-items: center; justify-content: center; transition: all .25s; }
    .pc-chk.on { transform: scale(1.35); }
    .pc-lbl  { font-size: 11px; font-weight: 700; color: var(--tx); line-height: 1.35; margin-bottom: 2px; }
    .pc-desc { font-size: 10px; color: var(--mu); line-height: 1.4; }

    /* ── Fields ── */
    .fgrp { display: flex; flex-direction: column; gap: 8px; }
    textarea, input[type=date] {
      width: 100%; padding: 12px 15px; border-radius: 13px;
      background: var(--surf2); border: 1px solid var(--bdr); color: var(--tx);
      font-family: 'Space Grotesk', sans-serif; font-size: 14px;
      resize: none; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    textarea::placeholder, input::placeholder { color: var(--di); }
    textarea:focus, input:focus { border-color: var(--bdr2); box-shadow: 0 0 0 3px rgba(160,240,192,.08); }
    input[type=date] { color-scheme: dark; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.5) sepia(1) saturate(4) hue-rotate(80deg); }

    /* ── Générer button ── */
    .btn-gen {
      width: 100%; padding: 17px; border-radius: 16px; border: none; cursor: pointer;
      font-family: 'Space Grotesk'; font-size: 15px; font-weight: 800; letter-spacing: .03em;
      color: #0a2010;
      background: linear-gradient(120deg, #c8a800 0%, #ffd700 40%, #ffe87a 55%, #ffd700 70%, #c8a800 100%);
      background-size: 250% 100%;
      animation: goldshim 4s linear infinite;
      box-shadow: 0 6px 30px rgba(255,215,0,.32);
      transition: transform .15s, box-shadow .15s;
    }
    @keyframes goldshim { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
    .btn-gen:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 42px rgba(255,215,0,.5); }
    .btn-gen:active:not(:disabled) { transform: scale(.982); }
    .btn-gen:disabled { opacity: .35; cursor: not-allowed; animation: none; }

    /* ── Error ── */
    .err { padding: 12px 16px; border-radius: 12px; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); color: #fca5a5; font-size: 13px; animation: errshk .4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes errshk { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

    /* ── Loading ── */
    .ldwrap   { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 52px 0; }
    .ldrings  { position: relative; width: 68px; height: 68px; }
    .ldr1     { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--gld); animation: rspin 1s linear infinite; }
    .ldr2     { position: absolute; inset: -8px; border-radius: 50%; border: 1px solid transparent; border-bottom-color: rgba(160,240,192,.35); animation: rspin 2.8s linear infinite reverse; }
    .ldrcore  { position: absolute; inset: 12px; border-radius: 50%; background: var(--gob); display: flex; align-items: center; justify-content: center; font-size: 14px; animation: ldpulse 1.6s ease-in-out infinite; overflow: hidden; }
    .ldrcore::before { content:''; position:absolute; inset:0; border-radius:50%; background:linear-gradient(90deg,transparent 0%,rgba(160,240,192,.45) 50%,transparent 100%); background-size:200% 100%; animation:shimmer 1.8s ease-in-out infinite; }
    @keyframes rspin  { to{transform:rotate(360deg)} }
    @keyframes ldpulse { 0%,100%{opacity:.5;transform:scale(.9)} 50%{opacity:1;transform:scale(1.1)} }
    @keyframes shimmer { from{background-position:-200% 0} to{background-position:200% 0} }
    .ldstep { font-size: 13px; color: var(--mu); font-weight: 600; animation: stpin .35s cubic-bezier(.16,1,.3,1) both; }
    @keyframes stpin { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .lddots { display: flex; gap: 7px; }
    .d { width: 5px; height: 5px; border-radius: 50%; background: rgba(160,240,192,.3); }
    .d:nth-child(1){animation:db 1.2s ease-in-out infinite 0s}
    .d:nth-child(2){animation:db 1.2s ease-in-out infinite .22s}
    .d:nth-child(3){animation:db 1.2s ease-in-out infinite .44s}
    @keyframes db { 0%,100%{transform:translateY(0);background:rgba(160,240,192,.3)} 50%{transform:translateY(-10px);background:var(--grn)} }

    /* ── Platform tabs ── */
    .ptabs { display: flex; gap: 5px; padding: 4px; border-radius: 16px; background: var(--surf); border: 1px solid var(--bdr); }
    .ptab  { flex: 1; padding: 10px; border-radius: 12px; border: none; font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--mu); background: transparent; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .ptab.on-fb { background: rgba(147,197,253,.12); color: var(--blue); border: 1px solid rgba(147,197,253,.22); }
    .ptab.on-ig { background: rgba(249,168,212,.1); color: var(--rose); border: 1px solid rgba(249,168,212,.2); }
    .ptab:active { transform: scale(.94); }

    /* ── Post card ── */
    .pcw        { border-radius: 18px; background: var(--surf2); border: 1px solid var(--bdr); overflow: hidden; margin-bottom: 10px; transition: border-color .2s, box-shadow .2s; }
    .pcw:hover  { border-color: var(--bdr2); box-shadow: 0 6px 26px rgba(0,0,0,.35); }
    .pcw.fb     { border-left: 3px solid rgba(147,197,253,.42); }
    .pcw.ig     { border-left: 3px solid rgba(249,168,212,.42); }
    .pchd       { padding: 11px 16px 9px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(160,240,192,.06); }
    .pcbdg      { padding: 2px 9px; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
    .pcbdg.fb   { background: rgba(147,197,253,.12); color: var(--blue); }
    .pcbdg.ig   { background: rgba(249,168,212,.1); color: var(--rose); }
    .pcvar      { font-size: 10px; color: var(--di); font-weight: 600; }
    .pcbd       { padding: 14px 16px; }
    .pctx       { font-size: 14px; line-height: 1.78; color: rgba(240,255,244,.88); white-space: pre-wrap; word-break: break-word; }
    .pcft       { padding: 8px 16px 12px; display: flex; align-items: center; gap: 8px; }
    .btn-cp     { padding: 6px 14px; border-radius: 10px; border: 1px solid var(--bdr2); background: var(--gb); color: var(--grn); font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .18s; }
    .btn-cp:hover { background: var(--gb2); border-color: rgba(160,240,192,.4); transform: translateY(-1px); }
    .btn-cp     { position: relative; }
    .btn-cp.ok  { background: rgba(160,240,192,.14); color: #a7f3d0; border-color: rgba(160,240,192,.5); animation: cpbounce .3s cubic-bezier(.16,1,.3,1); }
    .btn-cp.ok::after { content:''; position:absolute; inset:0; border-radius:10px; border:2px solid rgba(160,240,192,.55); animation: cpripple .55s ease-out forwards; pointer-events:none; }
    @keyframes cpbounce { 0%{transform:scale(.85)} 60%{transform:scale(1.1)} 100%{transform:scale(1)} }
    @keyframes cpripple { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.45)} }
    .btn-pv     { padding: 5px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.04); color: var(--mu); font-family: 'Space Grotesk'; font-size: 11px; font-weight: 600; cursor: pointer; transition: all .18s; margin-left: auto; }
    .btn-pv:hover { background: rgba(255,255,255,.08); }
    .btn-pv.on  { background: var(--gb); color: var(--grn); border-color: var(--bdr2); }
    .btn-regen  { width: 100%; padding: 15px; border-radius: 16px; border: 1px solid var(--bdr2); background: var(--gb); color: var(--grn); font-family: 'Space Grotesk'; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-regen:hover { background: rgba(160,240,192,.15); border-color: rgba(160,240,192,.42); transform: translateY(-2px); box-shadow: 0 8px 26px rgba(160,240,192,.15); }

    /* ── Saved ── */
    .saved      { padding: 11px 14px; border-radius: 14px; background: var(--gob); border: 1px solid var(--gob2); display: flex; align-items: center; gap: 12px; animation: bpop .45s cubic-bezier(.16,1,.3,1) .1s both; }
    .saved-icon { font-size: 15px; flex-shrink: 0; }
    .saved-t    { font-size: 12px; font-weight: 700; color: rgba(255,215,0,.9); }
    .saved-s    { font-size: 11px; color: rgba(255,215,0,.5); margin-top: 1px; }
    @keyframes bpop { from{opacity:0;transform:scale(.94) translateY(-5px)} to{opacity:1;transform:none} }

    /* Mock reveal */
    .mrev { animation: mkin .3s cubic-bezier(.16,1,.3,1) both; }
    @keyframes mkin { from{opacity:0;transform:scale(.97) translateY(8px)} to{opacity:1;transform:none} }

    /* ── Empty state ── */
    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:70px 20px; text-align:center; min-height:320px; }
    .empty-icon { font-size:48px; animation:efloat 5s ease-in-out infinite; }
    @keyframes efloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }

    /* ── FB mockup ── */
    .mock-fb { background:#fff; border-radius:12px; overflow:hidden; }
    .mfbhd { display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
    .mfbav { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#1877F2,#42b0ff); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; flex-shrink:0; }
    .mfbnm { font-size:13px; font-weight:700; color:#050505; }
    .mfbti { font-size:11px; color:#65676b; }
    .mfbbd { padding:2px 14px 12px; font-size:14px; line-height:1.65; color:#050505; white-space:pre-wrap; word-break:break-word; }
    .mfbac { border-top:1px solid #e4e6ea; padding:4px 14px; display:flex; }
    .mfbact { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:8px 4px; font-size:12px; font-weight:600; color:#65676b; }
    /* ── IG mockup ── */
    .mock-ig { background:#0d0f1e; border:1px solid rgba(255,255,255,.08); border-radius:12px; overflow:hidden; }
    .mighd { display:flex; align-items:center; gap:10px; padding:10px 14px; }
    .migav { width:30px; height:30px; border-radius:50%; background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); padding:2px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .migavi { width:100%; height:100%; border-radius:50%; background:#0d0f1e; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:10px; }
    .miguser { font-size:12px; font-weight:700; color:#E8EEFF; }
    .migmore { margin-left:auto; color:rgba(232,238,255,.5); font-size:16px; letter-spacing:2px; }
    .migimg { width:100%; aspect-ratio:1; background:linear-gradient(135deg,#0a0d20,#111830,#0d1528); display:flex; align-items:center; justify-content:center; font-size:44px; color:rgba(232,238,255,.1); }
    .migacts { display:flex; gap:14px; padding:10px 14px 4px; }
    .miga    { font-size:22px; line-height:1; }
    .migsave { margin-left:auto; font-size:22px; line-height:1; }
    .miglikes { padding:0 14px 4px; font-size:12px; font-weight:700; color:#E8EEFF; }
    .migcap { padding:2px 14px 14px; font-size:13px; line-height:1.55; color:rgba(232,238,255,.85); white-space:pre-wrap; word-break:break-word; }
    .migcap strong { color:#E8EEFF; }

    /* ── Profile ── */
    .profhero { padding:24px 22px 22px; border-radius:22px; background:var(--surf); border:1px solid var(--bdr); position:relative; overflow:hidden; }
    .profhero::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(160,240,192,.06) 0%,transparent 60%); pointer-events:none; }

    .ck-rs-item { display: flex; align-items: center; gap: 4px; }

    /* ── Upload zone ── */
    .upload-zone { width: 100%; padding: 14px 15px; border-radius: 13px; background: var(--surf2); border: 1px dashed var(--bdr2); color: var(--mu); font-family: 'Space Grotesk', sans-serif; font-size: 13px; cursor: pointer; transition: border-color .2s, background .2s; display: flex; align-items: center; gap: 9px; }
    .upload-zone:hover { border-color: rgba(160,240,192,.4); background: var(--surf); }
    .upload-preview { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 13px; background: var(--surf2); border: 1px solid var(--bdr2); }
    .upload-prev-img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .upload-prev-info { flex: 1; min-width: 0; }
    .upload-prev-name { font-size: 12px; color: var(--mu); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upload-prev-sub { font-size: 10px; color: var(--di); margin-top: 2px; }
    .upload-rm { padding: 4px 9px; border-radius: 8px; border: 1px solid rgba(239,68,68,.2); background: rgba(239,68,68,.06); color: #fca5a5; font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: background .15s; }
    .upload-rm:hover { background: rgba(239,68,68,.14); }

    /* ── Format chips ── */
    .fmt-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .fmt-chip { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--bdr2); background: transparent; font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; color: var(--mu); cursor: pointer; transition: all .18s; text-transform: uppercase; letter-spacing: .06em; }
    .fmt-chip:hover { background: var(--gb); color: var(--grn); }
    .fmt-chip.on { background: var(--gb2); color: var(--grn2); border-color: rgba(160,240,192,.5); }
    .fmt-chip:active { transform: scale(.93); }

    /* ── Publish button (par carte) ── */

    /* ── ResScreen photo source ── */

<body>

<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function FBIcon({ size = 14 }) {

  const WEBHOOK = 'https://stefbystep.app.n8n.cloud/webhook/manoire-posts';
  const OPENING = new Date('2026-07-09');
  const STEPS   = ['Analyse du pilier…','Construction du brief…','GPT génère les posts…','Sauvegarde Airtable…','Finalisation…'];

  const FORMATS = [
    { id: 'storytelling', label: 'Storytelling' },
    { id: 'question',     label: 'Question' },

    { id: 'teaser',       label: 'Teaser' },

  const PILLARS = [
    { id:'travaux',   code:'TR', label:'Coulisses travaux',       desc:'Le chantier en direct',     ac:'#fbbf24', img:'pg-travaux',   pic:'chalet-wood' },
    { id:'anouck',    code:'AN', label:'Anouck & vie du col',     desc:'La Saint-Bernard inspecte', ac:'#f9a8d4', img:'pg-anouck',    pic:'saint-bernard' },

    { id:'lieu',      code:'LI', label:'Vue & lieu',              desc:'1512m, Préalpes, Léman',    ac:'#93c5fd', img:'pg-lieu',      pic:'swiss-alps' },
    { id:'histoire',  code:'HI', label:'Histoire & transmission', desc:'Mémoire et renaissance',    ac:'#c4b5fd', img:'pg-histoire',  pic:'old-stone' },
    { id:'countdown', code:'J-', label:'Compte à rebours',        desc:'J-X avant ouverture',       ac:'#fb923c', img:'pg-countdown', pic:'restaurant-table' },
  ];

  const BRAND_ROWS = [
    {k:'Établissement', v:'Restaurant-refuge alpin'},
    {k:'Localisation',  v:'Col de Jaman · 1512m · Préalpes vaudoises'},
    {k:'Ouverture',     v:'9 juillet 2026'},

  function getJX() {
    const d = Math.ceil((OPENING - new Date()) / 86400000);
    if (d > 0) return { label:`J-${d}`, val:d, sub:"avant l'ouverture" };
    if (d === 0) return { label:'J-0', val:0, sub:"C'est aujourd'hui !" };
    return { label:'✓', val:0, sub:`Ouvert depuis ${Math.abs(d)} jours` };
  }

  function JXCount({ jx }) {
    const [n, setN] = useState(0);
    const done = useRef(false);
    useEffect(() => {
      if (done.current || jx.val === 0) { setN(jx.val); return; }
      done.current = true;
      const t0 = performance.now(), dur = 1200;
      function tick(t) {
        const p = Math.min((t - t0) / dur, 1);
        setN(Math.round(jx.val * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }, [jx.val]);
    return <span>{jx.val > 0 ? `J-${n}` : jx.label}</span>;
  }

  function TopBar({ tab, setTab, jx, hasRes }) {
    return (
      <div className="topbar">
        <div>

          <div className="brand-sub">Studio Posts — Génération IA</div>

            <button key={t.id} className={`tnav${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>

  }

  function MtnSVG() {
    return (
      <svg className="ck-mtn" viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice" fill="none">
        <path d="M0 90 L80 30 L150 65 L240 10 L310 50 L380 25 L400 35 L400 90Z" fill="rgba(160,240,192,.55)"/>
        <path d="M0 90 L120 55 L190 75 L260 35 L340 60 L400 40 L400 90Z" fill="rgba(160,240,192,.3)"/>
        <path d="M0 90 L60 72 L110 82 L170 58 L230 74 L290 50 L350 68 L400 55 L400 90Z" fill="rgba(160,240,192,.14)"/>

  function Cockpit({ jx, compact }) {

      <div className="cockpit" style={compact?{padding:'12px 18px'}:{}}>
        <MtnSVG/>
        {compact ? (

            <div style={{position:'relative',zIndex:1}}>

            <div style={{marginLeft:'auto',fontSize:22,fontWeight:800,color:'var(--gld)',position:'relative',zIndex:1,textShadow:'0 0 24px rgba(255,215,0,.4)'}}>{jx.label}</div>
          </>

              <div style={{fontSize:10,color:'var(--grn)',fontWeight:700,marginTop:6,letterSpacing:'.06em'}}>Prêt à publier ?</div>
            </div>
            <div className="ck-div"/>
            <div className="ck-r">

              <div className="ck-rs">

                <span style={{color:'var(--di)',fontSize:10}}>·</span>

              </div>
            </div>
          </>
        )}

    );
  }

  function PillarCard({ p, sel, onSel, visible }) {
    const on = sel === p.id;
    return (
      <div
        className={`pcard${on?' sel':''}`}
        style={{
          borderTopColor: on ? p.ac : 'var(--bdr)',
          borderTopWidth: on ? '2px' : '1px',

      >

  function PillarGrid({ sel, onSel }) {
    const [vis, setVis] = useState([]);
    useEffect(() => {
      const timers = PILLARS.map((p, i) =>
        setTimeout(() => setVis(v => [...v, p.id]), i * 130 + 200)

    return (
      <div className="pgrid">
        {PILLARS.map(p => (

            key={p.id}
            p={p}
            sel={sel}

  function PostCard({ text, idx, plat, visible, pillar, brief, targetDate }) {
    const [cp, setCp] = useState(false);
    const [cpk, setCpk] = useState(0);
    const [prev, setPrev] = useState(true);
    const [published, setPublished] = useState(false);
    const [pubLoading, setPubLoading] = useState(false);
    async function copy() {
      try { await navigator.clipboard.writeText(text); setCp(true); setCpk(k=>k+1); setTimeout(()=>setCp(false),2200); } catch{}
    }
    async function markPublished() {
      if (published || pubLoading) return;
      setPubLoading(true);
      try {
        await fetch('https://stefbystep.app.n8n.cloud/webhook/manoire-save-post', {

    return (
      <div className={`pcw ${plat}`} style={{

                <div className="mfbbd">{text}</div>
                <div className="mfbac"><div className="mfbact">👍 J'aime</div><div className="mfbact">💬 Commenter</div><div className="mfbact">↗️ Partager</div></div>
              </div>
            ) : (
              <div className="mock-ig">
                <div className="mighd"><div className="migav"><div className="migavi">M</div></div><div className="miguser">lemanoire.jaman</div><div className="migmore">···</div></div>
                <div className="migimg">🏔️</div>
                <div className="migacts"><span className="miga">🤍</span><span className="miga">💬</span><span className="miga">✈️</span><span className="migsave">🔖</span></div>
                <div className="miglikes">142 j'aime</div>

          {published

          }

  function Loading() {
    const [idx, setIdx] = useState(0);
    const [key, setKey] = useState(0);
    useEffect(()=>{
      const id = setInterval(()=>{setIdx(i=>(i+1)%STEPS.length);setKey(k=>k+1);},2300);
      return ()=>clearInterval(id);

    return (
      <div className="ldwrap">
        <div className="ldrings"><div className="ldr2"/><div className="ldr1"/><div className="ldrcore">✦</div></div>

  async function compressToBase64(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX = 1600;
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
          else { width = Math.round(width * MAX / height); height = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  function PublishButton({ airtableId }) {
    const [done, setDone] = useState(false);
    const [loading, setLoading] = useState(false);
    async function markPublished() {

      setLoading(true);
      try {
        await fetch('https://stefbystep.app.n8n.cloud/webhook/manoire-mark-published', {

          headers: { 'Content-Type': 'application/json' },

        setDone(true);

      setLoading(false);

    if (done) return <div className="pub-done">✓ Post mémorisé — GPT l'évite lors des prochaines générations</div>;
    return (
      <button className="btn-pub" onClick={markPublished} disabled={loading}>
        {loading ? '…' : '✓ Marquer comme publié'}

  function GenScreen({ jx, onDone, leaving }) {
    const [pillar, setPillar] = useState(null);
    const [format, setFormat] = useState(null);
    const [brief, setBrief] = useState('');
    const [date, setDate] = useState('');
    const [imageB64, setImageB64] = useState(null);
    const [imageName, setImageName] = useState(null);
    const [loading, setLoading] = useState(false);
    const [err, setErr] = useState(null);
    const [errk, setErrk] = useState(0);

    async function gen() {
      if (!pillar && !brief.trim() && !imageB64) {
        setErr('Sélectionne un pilier, ajoute un brief ou une photo.');
        setErrk(k=>k+1); return;
      }
      setLoading(true); setErr(null);
      try {
        let visionDescription = null;
        if (imageB64) {
          const vr = await fetch('/api/describe-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:imageB64})});
          const vd = await vr.json();
          visionDescription = vd.description || null;
        }
        const r = await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pillar_id:pillar||null,brief:brief.trim(),target_date:date,format:format||'',visionDescription:visionDescription||''})});
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        if (!d.ok) throw new Error(d.error||'Erreur workflow');
        onDone({ ...d, brief: brief.trim(), target_date: date }, imageB64);
      } catch(e) {
        setErr(`${e.message} — vérifie que le workflow n8n est actif.`);
        setErrk(k=>k+1);
      } finally { setLoading(false); }
    }

    return (
      <div className={`screen${leaving?' leaving':''}`}>
        <Cockpit jx={jx}/>
        <div>
          <div className="shead" style={{marginBottom:10}}><span className="caps">Pilier éditorial</span><div className="hline"/></div>
          <PillarGrid sel={pillar} onSel={p=>{setPillar(p);setErr(null);}}/>
        </div>
        <div className="fgrp">
          <span className="caps">Brief / Idée du post</span>
          <textarea rows={3} placeholder="Ex : Micka a trouvé les vieilles poutres d'origine sous le plâtre… ou décris juste la photo !" value={brief} onChange={e=>setBrief(e.target.value)}/>
        </div>
        <div className="fgrp">
          <span className="caps">Format <span style={{fontWeight:400,textTransform:'none',fontSize:10,opacity:.7}}>(optionnel)</span></span>
          <div className="fmt-row">
            {FORMATS.map(f=>(
              <button key={f.id} className={`fmt-chip${format===f.id?' on':''}`} onClick={()=>setFormat(format===f.id?null:f.id)}>{f.label}</button>
            ))}
          </div>
        </div>
        <div className="fgrp">
          <span className="caps">Photo source (optionnel)</span>
          {imageB64 ? (
            <div className="upload-preview">
              <img className="upload-prev-img" src={`data:image/jpeg;base64,${imageB64}`} alt="Aperçu"/>
              <div className="upload-prev-info">
                <div className="upload-prev-name">{imageName}</div>
                <div className="upload-prev-sub">Le post s'appuiera sur ce visuel</div>
              </div>
              <button className="upload-rm" onClick={()=>{setImageB64(null);setImageName(null);}}>✕</button>
            </div>
          ) : (
            <label className="upload-zone">
              <span style={{fontSize:16}}>📷</span>
              <span>Ajouter une photo (JPG, PNG…)</span>
              <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onChange={async e=>{
                const f = e.target.files?.[0];
                if (!f) return;
                const name = f.name.toLowerCase();
                const isHeic = f.type === 'image/heic' || f.type === 'image/heif' || name.endsWith('.heic') || name.endsWith('.heif');
                if (isHeic) {
                  setErr('Format HEIC non supporté. Sur iPhone : Réglages → Appareil photo → Formats → "Le plus compatible" (JPEG).'); setErrk(k=>k+1);
                  e.target.value = ''; return;
                }
                try {
                  const b64 = await compressToBase64(f);
                  setImageB64(b64); setImageName(f.name);
                } catch {
                  setErr('Impossible de lire la photo — essaie un format JPG ou PNG.'); setErrk(k=>k+1);
                }
                e.target.value = '';
              }}/>
            </label>
          )}
        </div>
        <div className="fgrp">
          <span className="caps">Date de publication cible</span>
          <input type="date" min={new Date().toISOString().split('T')[0]} value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        {err && <div key={errk} className="err">{err}</div>}
        {loading ? <Loading/> : <button className="btn-gen" onClick={gen}>✦ Générer 4 posts — 2 FB · 2 IG</button>}
      </div>
    );
  }

  function ResScreen({ results, jx, onBack, photoB64 }) {
    const [plat, setPlat] = useState('fb');
    const [vis, setVis] = useState(new Set());
    const posts = results ? (plat==='fb' ? results.fb||[] : results.ig||[]) : [];

    useEffect(()=>{
      if (!results) return;
      setVis(new Set());
      const timers = posts.map((_,i)=>setTimeout(()=>setVis(v=>new Set([...v,i])),i*180+80));
      return ()=>timers.forEach(clearTimeout);
    },[results,plat]);

    if (!results) return (
      <div className="empty">
        <div className="empty-icon">◈</div>
        <div style={{fontSize:15,color:'var(--mu)',fontWeight:600,lineHeight:1.6}}>Lance une génération<br/>pour voir les résultats ici</div>
        <div style={{fontSize:12,color:'var(--di)',marginTop:4}}>Onglet ✦ Générer</div>
      </div>
    );

    const { pillar, fb=[], ig=[] } = results;

    return (
      <div className="screen">
        <button className="back-mob" onClick={onBack}>← Nouveau post</button>
        <Cockpit jx={{label:results.jx||jx.label, val:0, sub:pillar}} compact/>
        {photoB64 && (
          <div className="res-photo">
            <img src={`data:image/jpeg;base64,${photoB64}`} alt="Photo source"/>
            <span className="res-photo-label">Photo source</span>
          </div>
        )}
        <div className="ptabs">
          <button className={`ptab${plat==='fb'?' on-fb':''}`} onClick={()=>setPlat('fb')}><FBIcon size={15}/>Facebook · {fb.length}</button>
          <button className={`ptab${plat==='ig'?' on-ig':''}`} onClick={()=>setPlat('ig')}><IGIcon size={15}/>Instagram · {ig.length}</button>
        </div>
        <div>
          {posts.length > 0
            ? posts.map((text,i) => <PostCard key={`${plat}-${i}`} text={text} idx={i} plat={plat} visible={vis.has(i)} pillar={results.pillar||''} brief={results.brief||''} targetDate={results.target_date||''}/>)
            : <div style={{fontSize:13,color:'var(--di)',padding:'12px 0'}}>Aucun post généré.</div>}
        </div>
        <button className="btn-regen" onClick={onBack}>↺ Nouvelle génération</button>
      </div>
    );
  }

  function ProfScreen({ jx }) {
    return (
      <div className="screen">
        <div className="profhero">
          <span className="caps">Client actif</span>
          <div className="profname">Le Manoïre</div>
          <div style={{fontSize:13,color:'var(--mu)',marginTop:6}}>Restaurant-refuge alpin · Col de Jaman</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            <span style={{padding:'5px 12px',borderRadius:20,background:'var(--gob)',border:'1px solid var(--gob2)',fontSize:11,fontWeight:700,color:'var(--gld)'}}>{jx.label} {jx.sub}</span>
            <span style={{padding:'5px 12px',borderRadius:20,background:'var(--gb)',border:'1px solid var(--bdr2)',fontSize:11,fontWeight:700,color:'var(--grn)'}}>6 piliers</span>
          </div>
        </div>
        <div className="infolist">
          {BRAND_ROWS.map((r,i)=>(
            <div key={i} className="inforow"><div className="infok">{r.k}</div><div className="infov">{r.v}</div></div>
          ))}
        </div>
        <div className="credit">
          <div className="caps" style={{marginBottom:8}}>Crédits</div>
          Application de génération de posts assistée par IA.<br/>
          Conçue par <strong style={{color:'rgba(240,255,244,.55)'}}>L'Atelier des Automates</strong> · <strong style={{color:'rgba(240,255,244,.55)'}}>Clockwork Ops</strong> · 2026.<br/>
          Génération IA : GPT-4o-mini via n8n. Stockage : Airtable.
        </div>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = useState('generate');
    const [results, setResults] = useState(null);
    const [photoB64, setPhotoB64] = useState(null);
    const [leaving, setLeaving] = useState(false);
    const jx = getJX();

    function goResults(d, img) {
      setLeaving(true);
      setTimeout(() => { setLeaving(false); setResults(d); setPhotoB64(img||null); setTab('results'); }, 300);
    }

    return (
      <>
        <div className="aurora"/>
        <div className="grid"/>
        <div className="app-root">
          <TopBar tab={tab} setTab={setTab} jx={jx} hasRes={!!results}/>
          <div className="main-body">
            <div className="lpanel" style={{display: tab==='generate'?'flex':'none', flexDirection:'column'}}>
              <GenScreen jx={jx} onDone={goResults} leaving={leaving}/>
            </div>
            <div className="rpanel" style={{display: tab!=='generate'?'flex':undefined}}>
              {tab==='profile'
                ? <ProfScreen jx={jx}/>
                : <ResScreen results={results} jx={jx} photoB64={photoB64} onBack={()=>setTab('generate')}/>
              }
            </div>
          </div>
        </div>
        <div className="mob-tabbar">
          <div className="mob-inner">
            {[{id:'generate',icon:'✦',lbl:'Générer'},{id:'results',icon:'◈',lbl:'Résultats'},{id:'profile',icon:'◎',lbl:'Marque'}].map(t=>(
              <button key={t.id} className={`mtb${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>
                {t.id==='results' && !!results && tab!=='results' && <span className="mtb-dot"/>}
                <span className="mtb-icon">{t.icon}</span>
                <span className="mtb-lbl">{t.lbl}</span>
              </button>
            ))}
          </div>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
