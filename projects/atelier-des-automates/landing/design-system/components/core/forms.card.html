<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--color-bg); padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input } = window.LAtelierDesAutomatesDesignSystem_95f56b;

function Demo() {
  const [val, setVal] = React.useState('');
  return (
    <div className="grid">
      <Input label="Prénom" placeholder="Marie" hint="Juste pour l'accueil." />
      <Input type="email" label="Email" placeholder="marie@exemple.fr" />
      <Input label="Avec icône" placeholder="Rechercher…" icon="🔍" />
      <Input label="Erreur" value="pas-un-email" error="Email invalide." />
      <Input label="Désactivé" placeholder="Non modifiable" disabled />
      <Input type="email" placeholder="ton@email.com" hint="Pas de spam, promis." value={val} onChange={e => setVal(e.target.value)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
