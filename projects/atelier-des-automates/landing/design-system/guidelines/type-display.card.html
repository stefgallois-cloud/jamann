<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); padding: 24px 28px; font-family: var(--font-display); display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-body); font-size: 10px; color: var(--color-text-muted); width: 64px; flex-shrink: 0; }
  .sample { color: var(--color-text-primary); line-height: var(--leading-tight); }
</style>
</head>
<body>
  <div class="row"><span class="label">7xl / 800</span><span class="sample" style="font-size:var(--text-7xl);font-weight:var(--weight-extrabold);letter-spacing:var(--tracking-tight)">Automate</span></div>
  <div class="row"><span class="label">5xl / 700</span><span class="sample" style="font-size:var(--text-5xl);font-weight:var(--weight-bold);letter-spacing:var(--tracking-tight)">L'Atelier des Automates</span></div>
  <div class="row"><span class="label">3xl / 600</span><span class="sample" style="font-size:var(--text-3xl);font-weight:var(--weight-semibold)">Laisse les outils bosser pour toi.</span></div>
  <div class="row"><span class="label">2xl / 600</span><span class="sample" style="font-size:var(--text-2xl);font-weight:var(--weight-semibold)">Workflows no-code &amp; IA</span></div>
  <div class="row"><span class="label">xl / 500</span><span class="sample" style="font-size:var(--text-xl);font-weight:var(--weight-medium)">Section header — La méthode</span></div>
</body>
</html>
