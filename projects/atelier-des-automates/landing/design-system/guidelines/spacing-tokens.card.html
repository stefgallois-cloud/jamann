<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Tokens" subtitle="Échelle 4px" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); display: flex; align-items: flex-end; padding: 20px 24px; gap: 10px; font-family: var(--font-body); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--color-primary); border-radius: 3px; width: 28px; opacity: 0.85; }
  .name { font-size: 9px; color: var(--color-text-muted); }
  .val  { font-size: 8px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="bar" style="height:4px"></div><span class="name">1</span><span class="val">4px</span></div>
  <div class="item"><div class="bar" style="height:8px"></div><span class="name">2</span><span class="val">8px</span></div>
  <div class="item"><div class="bar" style="height:12px"></div><span class="name">3</span><span class="val">12px</span></div>
  <div class="item"><div class="bar" style="height:16px"></div><span class="name">4</span><span class="val">16px</span></div>
  <div class="item"><div class="bar" style="height:20px"></div><span class="name">5</span><span class="val">20px</span></div>
  <div class="item"><div class="bar" style="height:24px"></div><span class="name">6</span><span class="val">24px</span></div>
  <div class="item"><div class="bar" style="height:32px"></div><span class="name">8</span><span class="val">32px</span></div>
  <div class="item"><div class="bar" style="height:40px"></div><span class="name">10</span><span class="val">40px</span></div>
  <div class="item"><div class="bar" style="height:48px"></div><span class="name">12</span><span class="val">48px</span></div>
  <div class="item"><div class="bar" style="height:64px"></div><span class="name">16</span><span class="val">64px</span></div>
  <div class="item"><div class="bar" style="height:80px"></div><span class="name">20</span><span class="val">80px</span></div>
  <div class="item"><div class="bar" style="height:96px"></div><span class="name">24</span><span class="val">96px</span></div>
</body>
</html>
