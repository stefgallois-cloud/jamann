<!-- @dsCard group="Colors" viewport="700x160" name="Primary Colors" subtitle="Indigo, Violet, Cyan" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); display: flex; align-items: center; padding: 20px; gap: 12px; font-family: var(--font-body); }
  .swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; }
  .block { width: 100%; height: 56px; border-radius: var(--radius-md); }
  .name { font-size: 11px; font-weight: 600; color: var(--color-text-primary); }
  .hex  { font-size: 11px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="swatch"><div class="block" style="background:var(--color-indigo-400)"></div><span class="name">Indigo 400</span><span class="hex">#818CF8</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-indigo-500)"></div><span class="name">Indigo 500 — Primary</span><span class="hex">#6366F1</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-indigo-600)"></div><span class="name">Indigo 600</span><span class="hex">#4F46E5</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-violet-400)"></div><span class="name">Violet 400</span><span class="hex">#A78BFA</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-violet-500)"></div><span class="name">Violet 500</span><span class="hex">#8B5CF6</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-cyan-500)"></div><span class="name">Cyan 500 — Accent</span><span class="hex">#06B6D4</span></div>
  <div class="swatch"><div class="block" style="background:var(--color-cyan-400)"></div><span class="name">Cyan 400</span><span class="hex">#22D3EE</span></div>
</body>
</html>
