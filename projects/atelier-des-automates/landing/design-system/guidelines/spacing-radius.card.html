<!-- @dsCard group="Spacing" viewport="700x130" name="Border Radius" subtitle="Du plus petit au plus arrondi" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); display: flex; align-items: center; padding: 24px; gap: 16px; font-family: var(--font-body); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 56px; height: 56px; background: var(--color-primary); opacity: 0.85; }
  .name { font-size: 10px; font-weight: 600; color: var(--color-text-primary); }
  .val  { font-size: 9px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="name">sm</span><span class="val">6px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="name">md</span><span class="val">10px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="name">lg</span><span class="val">16px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="name">xl</span><span class="val">24px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="name">2xl</span><span class="val">32px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><span class="name">full</span><span class="val">9999px</span></div>
</body>
</html>
