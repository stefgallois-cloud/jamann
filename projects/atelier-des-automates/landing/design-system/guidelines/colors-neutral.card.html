<!-- @dsCard group="Colors" viewport="700x160" name="Neutral Palette" subtitle="Slate scale" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-bg); display: flex; align-items: center; padding: 20px; gap: 8px; font-family: var(--font-body); }
  .swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; flex: 1; }
  .block { width: 100%; height: 56px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: 10px; font-weight: 600; color: var(--color-text-primary); }
  .hex  { font-size: 10px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="swatch"><div class="block" style="background:#F8FAFC"></div><span class="name">Slate 50</span><span class="hex">#F8FAFC</span></div>
  <div class="swatch"><div class="block" style="background:#F1F5F9"></div><span class="name">Slate 100</span><span class="hex">#F1F5F9</span></div>
  <div class="swatch"><div class="block" style="background:#E2E8F0"></div><span class="name">Slate 200</span><span class="hex">#E2E8F0</span></div>
  <div class="swatch"><div class="block" style="background:#CBD5E1"></div><span class="name">Slate 300</span><span class="hex">#CBD5E1</span></div>
  <div class="swatch"><div class="block" style="background:#94A3B8"></div><span class="name">Slate 400</span><span class="hex">#94A3B8</span></div>
  <div class="swatch"><div class="block" style="background:#64748B"></div><span class="name">Slate 500</span><span class="hex">#64748B</span></div>
  <div class="swatch"><div class="block" style="background:#475569"></div><span class="name">Slate 600</span><span class="hex">#475569</span></div>
  <div class="swatch"><div class="block" style="background:#334155"></div><span class="name">Slate 700</span><span class="hex">#334155</span></div>
  <div class="swatch"><div class="block" style="background:#1E293B"></div><span class="name">Slate 800</span><span class="hex">#1E293B</span></div>
  <div class="swatch"><div class="block" style="background:#0F172A"></div><span class="name">Slate 900</span><span class="hex">#0F172A</span></div>
</body>
</html>
