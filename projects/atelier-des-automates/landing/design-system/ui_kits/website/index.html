<div id="root"></div>
<script type="text/babel">

function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, href, style: extra = {} }) {
  const [hov, setHov] = React.useState(false);
  const sizes = { sm: { fontSize: '0.875rem', padding: '8px 18px' }, md: { fontSize: '1rem', padding: '12px 24px' }, lg: { fontSize: '1.0625rem', padding: '15px 32px' } };
  const variants = {
    primary:   { background: hov ? '#4F46E5' : '#6366F1', color: 'white', boxShadow: hov ? '0 6px 20px rgba(99,102,241,0.4)' : '0 2px 8px rgba(99,102,241,0.25)', transform: hov ? 'translateY(-1px)' : 'none' },
    secondary: { background: hov ? 'rgba(99,102,241,0.06)' : 'transparent', color: '#6366F1', border: '2px solid #6366F1', transform: hov ? 'translateY(-1px)' : 'none' },
    ghost:     { background: hov ? 'rgba(255,255,255,0.06)' : 'transparent', color: 'rgba(255,255,255,0.7)' },
    gradient:  { background: 'linear-gradient(135deg, #6366F1 0%, #A78BFA 100%)', color: 'white', boxShadow: hov ? '0 8px 24px rgba(99,102,241,0.45)' : '0 4px 14px rgba(99,102,241,0.30)', transform: hov ? 'translateY(-1px)' : 'none' },
  };
  const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontFamily: 'Inter, sans-serif', fontWeight: 600, borderRadius: '9999px', border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1, textDecoration: 'none', transition: 'all 220ms ease', whiteSpace: 'nowrap', lineHeight: 1, ...sizes[size], ...variants[variant], ...extra };
  const props = { style: base, onMouseEnter: () => setHov(true), onMouseLeave: () => setHov(false), onClick: disabled ? undefined : onClick, disabled };
  return href ? <a href={href} {...props}>{children}</a> : <button {...props}>{children}</button>;
}

function Badge({ children, variant = 'default', style: extra = {} }) {
  const variants = {
    default: { background: 'rgba(99,102,241,0.1)', color: '#4338CA' },
    violet:  { background: 'rgba(167,139,250,0.12)', color: '#7C3AED' },
    cyan:    { background: 'rgba(6,182,212,0.12)', color: '#0891B2' },
    dark:    { background: 'rgba(255,255,255,0.12)', color: 'rgba(255,255,255,0.9)' },
  };
  return <span style={{ display:'inline-flex', alignItems:'center', fontFamily:'Inter,sans-serif', fontWeight:600, borderRadius:'9999px', letterSpacing:'0.06em', textTransform:'uppercase', fontSize:'0.7rem', padding:'4px 10px', ...variants[variant], ...extra }}>{children}</span>;
}

const steps = [

const testimonials = [

  { quote: 'Je savais pas que c\'était aussi simple. Maintenant mes devis partent automatiquement après chaque appel.', name: 'Thomas R.', role: 'Consultant freelance', initials: 'TR', color: '#A78BFA' },

];

      {/* HERO */}

            <div className="hero-actions">

      {/* TESTIMONIALS */}

          <div className="testi-grid">
            {testimonials.map(t => (
              <div key={t.name} className="testi-card">
                <p className="testi-quote">"{t.quote}"</p>

                  <div className="testi-avatar" style={{background: t.color}}>{t.initials}</div>
                  <div>
                    <div className="testi-name">{t.name}</div>

            ))}

      {/* EMAIL */}

          <div style={{display:'flex',gap:'10px',maxWidth:'460px',margin:'0 auto'}}>

            />

          </div>

      </section>

      {/* CTA DARK */}
