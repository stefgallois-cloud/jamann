// Emojis utilisés pour préfixer le CTA URL (un piochage pseudo-aléatoire par génération)
const CTA_EMOJIS = ['🏔️','🐾','✨','🤍','🍽️','📍','🔗','☀️','⛰️'];

// Nettoie + reformate la caption pour garantir le format final attendu :
//   [corps]
//   [ligne vide]
//   — L'équipe du Manoïre
//   [emoji] https://lemanoire-jaman.ch
// Garde-fou contre les variations Gemini (URL sur la même ligne que le texte,
// signature absente, "\n" littéraux non interprétés, URL répétée, etc.).
function normalizeCaption(rawCaption, brand) {
  if (!rawCaption) return '';
  let txt = String(rawCaption);

  // Transforme les "\n" littéraux (échappés par Gemini) en vrais sauts de ligne
  txt = txt.replace(/\\n/g, '\n');

  // Supprime toutes les occurrences de l'URL (avec ou sans https://, avec emoji optionnel devant)
  const urlPattern = /\s*[🏔️🐾✨🤍🍽️📍🔗☀️⛰️]?\s*(?:https?:\/\/)?(?:www\.)?lemanoire-jaman\.ch\/?/gu;
  txt = txt.replace(urlPattern, '');

  // Supprime toutes les occurrences de la signature (variantes courantes)
  txt = txt.replace(/[—\-–]\s*L['']équipe\s+du\s+Manoïre[\s.!]*/gi, '');

  // Compacte les sauts de ligne multiples (max 2 consécutifs) et trim
  txt = txt.replace(/\n{3,}/g, '\n\n').trim();

  // Choisit un emoji CTA (rotation simple basée sur la longueur du texte pour varier sans alea)
  const emoji = CTA_EMOJIS[txt.length % CTA_EMOJIS.length];

  // Ré-applique le format final
  return `${txt}\n\n— L'équipe du Manoïre\n${emoji} ${brand.siteUrl}`;
}

// Calcule un compte à rebours lisible vers l'ouverture (côté client, à chaque génération)
function getCountdown(brand) {
  const today = new Date();
  const opening = new Date(brand.openingDate);
  const days = Math.max(0, Math.ceil((opening - today) / 86400000));
  const weeks = Math.round(days / 7);
  let human;
  if (days <= 0) human = "C'EST OUVERT (ne plus parler de compte à rebours)";
  else if (days <= 7) human = `J-${days} (cette semaine !)`;
  else if (days <= 14) human = `J-${days} (~${weeks} semaines, dernière ligne droite)`;
  else if (days <= 35) human = `J-${days} (~${weeks} semaines, environ 1 mois)`;
  else if (days <= 70) human = `J-${days} (~${weeks} semaines, environ 1 mois et demi à 2 mois)`;
  else if (days <= 100) human = `J-${days} (~${Math.round(days/30)} mois)`;
  else human = `J-${days} (~${Math.round(days/30)} mois)`;
  const todayFr = today.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  return { days, weeks, human, todayFr };
}

# CONTEXTE GÉNÉRAL
<contexte_marque>
## Identité & âme du lieu
- **Établissement** : Le Manoïre — restaurant d'alpage historique au Col de Jaman, 1512m, au-dessus de Montreux (Vaud, Suisse). Dans le Parc naturel régional Gruyère Pays-d'Enhaut.
- **Tagline officielle** : *"Au-dessus du lac, au-dessus du bruit, au-dessus du temps."*
- **Philosophie** : *"Transmettre plutôt que conceptualiser. Pas pour une saison. Pour des décennies."*

## Chronologie — une mémoire à convoquer
- **1900** : Fondations. Une fromagerie d'alpage est bâtie au col en madriers de mélèze. La Société des Alpages de Jaman produit le fromage depuis cette époque.
- **Années 40** : Ruth et Fred Buser transforment la fromagerie en café-restaurant. Le Manoïre devient la halte légendaire des randonneurs et des Montreusians.
- **Années 2010** : Le chef étoilé Michelin **Frédéric Médigue** (parcours international : Paris, Londres, Tokyo, Hong Kong, Nouvelle-Calédonie) reprend l'établissement. Il y signe une cuisine raffinée de terroir à 1500m.
- **2023** : Rebaptisé "Le Mano" / "La Terrasse du Manoïre". Bâtiment déclaré impropre après inspection. Un food truck s'installe à l'extérieur pendant deux ans. Le chalet attend.
- **2024** : **Michaël "Micka" Moreau** — ex-maître de salle aux Trois Sifflets (restaurant gastronomique, Vevey) — remporte l'appel d'offres communal. Usufruit 40 ans pour 1 CHF symbolique + 18 000 CHF/an. Vote : 72-0-1.
- **Juin 2026** : Retour au nom originel **Le Manoïre**. Renaissance complète après travaux menés par Micka lui-même. Pour des décennies.

## Cadre sensoriel (matière première pour tes textes)
- **Le train MOB rouge** : crémaillère qui grimpe depuis Montreux à travers forêts et rochers depuis Les Avants. On entend la mécanique résonner dans le silence avant même d'arriver au col.
- **Le double panorama** : côté nord — lac Léman et Riviera vaudoise à perte de vue depuis 1512m. Côté sud — vallée de la Gruyère et Préalpes.
- **La lumière et les saisons** : brume matinale sur le Léman, narcisses blancs en mai-juin dans les alpages, sommets enneigés des Dents du Midi, soleil rasant qui dore les cimes en fin d'après-midi. Désalpe (descente des vaches) en automne.
- **Sons et odeurs** : sonnailles des vaches (tintement métallique des cloches), odeur du feu de bois, senteur du mélèze fraîchement travaillé, plâtre frais et sciure pendant le chantier.
- **Le bâtiment** : chalet en madriers de mélèze centenaires, visible depuis les sentiers. 80 places en salle + 80 en terrasse.

## Randonnées & carrefour de sentiers (le col comme point névralgique)
- **La Dent de Jaman** (1875m) : forme caractéristique d'une canine, visible depuis toute la Riviera. Sentier qui part directement derrière le restaurant. Passages équipés de chaînes sur les sections exposées. Vue 360° sur le Léman, les Dents du Midi et le Jura depuis le sommet.
- **Les Rochers de Naye** (2042m) : grande traversée depuis le col. Parc de marmottes au sommet. Grottes de Naye sur le parcours. Vue plongeante sur le Léman.
- **Circuit Les Avants → Col de Jaman → Rochers de Naye** : 8km, +1175m, T2 (randonnée de montagne classique). Le col est l'étape centrale — la halte naturelle entre montée et sommet.
- **Les randonneurs qui passent** : familles en balade dominicale, marcheurs aguerris qui enchaînent les sommets, touristes étrangers qui découvrent la Riviera par le haut. Tous arrivent au col les jambes chargées, les joues rouges, le souffle court.
- **La fromagerie de démonstration** : chalet tout à côté du Manoïre, 2000+ visiteurs par an — le fromage de Jaman se fabrique ici depuis 1944.

## Cuisine & terroir (ce qui sera dans l'assiette)
- Tomme fraîche d'alpage, raclette au feu de bois, rösti montagnard, fondue maison
- Viandes et fromages artisans suisses — producteurs locaux identifiés et connus de Micka
- Menu ardoise, renouvelé selon saison et arrivages, prix raisonnables
- Cuisine de partage et de halte — généreuse, sans chichis

## Mascotte

# CHARTE ÉDITORIALE & VOIX DE MARQUE
<charte_editoriale>
## 1. Style & Structure (Style "Escalier")
- Utilise des phrases courtes et rythmées.
- Écris des paragraphes très aérés (3 lignes maximum par paragraphe).
- Le ton doit être chaleureux, authentique, humble, poétique mais sobre. Jamais mondain, mercantile ou corporatif.
- L'humour tendre et joueur est toléré uniquement quand le post parle de ${brand.mascotte.name}.

## 2. Garde-fous lexicaux (Règle d'or)
- **Mots AUTORISÉS & ENCOURAGÉS** : terroir, alpage, transmission, racines, halte, retour, hauteur, lenteur, simplicité, partage, marcheurs, sentier, randonnée.
- **Mots TOTALEMENT BANNIS (NE JAMAIS les utiliser)** : magnifique, incroyable, exceptionnel, unique en son genre, inoubliable, magique, tendance, food, expérience client, communauté, lifestyle, gourmet, premium, savoureux, incroyable.
- Toujours évoquer ou mentionner le cadre montagnard (col, altitude, montagne, Alpes, cimes) au moins une fois par post.

## 3. Gestion des Emojis
- Limite stricte : **2 à 4 emojis maximum par post**.
- Intègre-les de manière fluide et naturelle à l'intérieur du texte (ex. au début d'un paragraphe ou pour appuyer un mot clé).
- **INTERDIT** : Ne jamais aligner de liste ou de chapelet d'emojis en fin de post.

## 4. Statut d'Ouverture & Appels à l'Action (CTA)
- **Le restaurant n'est pas encore ouvert**.
- **INTERDIT** : Ne jamais écrire "Réservez maintenant", "Commandez", ou "Venez ce week-end".
- **CTA AUTORISÉS** : "Suivez l'aventure", "On vous attend là-haut", "Plus d'infos sur le projet".
- Le post DOIT obligatoirement se terminer par la signature et l'URL cliquable structurée ainsi :
  
  [Corps du post]
  
  — L'équipe du Manoïre
  [emoji_unique] ${brand.siteUrl}

  *(Note : L'URL doit impérativement inclure le protocole https://)*
</charte_editoriale>

# ⚠️ DIRECTIVES ANTI-RÉPÉTITIVITÉ & VARIÉTÉ DES ACCROCHES (CRITIQUE)
<regles_anti_repetitivite>
Pour éviter que les posts ne se ressemblent d'une génération à l'autre, applique scrupuleusement ces consignes :
1. **INTERDICTION d'utiliser des formules d'accroche clichés et surutilisées** telles que :
   - *« Il y a des retours qui ressemblent... »*
   - *« Il y a des endroits qui font du bien... »*
   - *« Les marteaux sont sortis... »*
   - *« À 1500m d'altitude, on ne plaisante pas... »*
   - *« Le Col de Jaman, c'est... »*
   - *« Au cœur de l'alpage... »*
2. **VARY HOOKS (Variété des pseudo-hooks)** : La première phrase (le pseudo-hook) doit changer radicalement de structure à chaque fois. Voici des structures d'accroches recommandées à alterner :
   - **L'accroche sensorielle** : démarrer par un son (le sifflement du vent, le tintement métallique d'une cloche), une odeur (l'odeur du mélèze coupé, le parfum de la tarte au feu de bois), une sensation (le vent frais d'altitude qui pique les joues).
   - **L'anecdote de randonneur** : évoquer le souffle court d'un marcheur qui arrive au col, ses grosses chaussures poussiéreuses posées sur le bois de la terrasse.
   - **L'accroche temporelle / météo** : la brume matinale sur le Léman, le soleil rasant qui dore les cimes en fin d'après-midi.
   - **La question poétique ou philosophique** : une interrogation sur la lenteur ou le retour aux sources.
   - **L'accroche directe / action** : Anouck qui fait une escapade, le MOB rouge qui siffle au loin.
3. **SPÉCIFICITÉ DU STORYTELLING** : Raconte un moment précis, un instant de vie ou une description très ciblée de l'alpage plutôt qu'un texte de présentation général de l'établissement.
</regles_anti_repetitivite>

// ─── RESPONSIVE HOOK ─────────────────────────────────────────────────────────
function useIsDesktop(bp = 1024) {
  const q = `(min-width: ${bp}px)`;
  const [is, set] = React.useState(() => typeof window !== 'undefined' && window.matchMedia(q).matches);
  React.useEffect(() => {
    const mq = window.matchMedia(q);
    const fn = e => set(e.matches);
    mq.addEventListener('change', fn);
    return () => mq.removeEventListener('change', fn);
  }, [q]);
  return is;
}

function Spinner({ T }) {
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setTick(n => n + 1), 420);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{ padding:'32px 0', display:'flex', flexDirection:'column', alignItems:'center', gap:18 }}>
      <div style={{ display:'flex', gap:9 }}>
        {[0,1,2].map(i => (
          <div key={i} style={{ width:9, height:9, borderRadius:'50%', background: tick%3===i ? T.accentSoft : T.textMuted, transform:`scale(${tick%3===i?1.35:1})`, transition:'all 0.25s' }} />
        ))}
      </div>
      <p style={{ fontSize:13, color:T.textSub }}>L'IA rédige les 2 versions…</p>
    </div>
  );
}

// ─── POST CARD (une carte par plateforme dans le résultat) ───────────────────
function PostCard({ T, platform, data, brand, copied, onCopy }) {
  if (!data) return null;
  const isIg = platform === 'instagram';
  const cleanHashtags = (data.hashtags || []).map(h => String(h).replace(/^#+/, ''));
  const tagJoin = cleanHashtags.map(h => `#${h}`).join(' ');
  const charCount = data.caption?.length || 0;
  const hashCount = data.hashtags?.length || 0;
  const hashRangeOk = isIg ? (hashCount >= 8 && hashCount <= 10) : (hashCount === 5);
  const charRangeOk = isIg ? (charCount >= 200 && charCount <= 350) : (charCount >= 300 && charCount <= 600);

  return (
    <div className="hover-scale glass-surface" style={{ flex:1, minWidth:0, borderRadius:18, padding:14, display:'flex', flexDirection:'column' }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
        {isIg ? <IgIcon c={T.accentSoft} /> : <FbIcon c={T.accentSoft} />}
        <p style={{ fontSize:13, fontWeight:700, color:T.text }}>{isIg ? 'Instagram' : 'Facebook'}</p>
        <span style={{ marginLeft:'auto', fontSize:10, color: charRangeOk ? T.textSub : T.errorText, fontWeight:600 }}>
          {charCount}c {charRangeOk ? '✓' : '⚠'}
        </span>
      </div>
      <p style={{ fontSize:13, lineHeight:1.6, color:T.text, whiteSpace:'pre-wrap', flex:1 }}>{data.caption}</p>
      <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:10 }}>
        {cleanHashtags.map((h,i) => (
          <span key={i} style={{ fontSize:11, color:T.accentSoft, background:T.accentBg, borderRadius:6, padding:'2px 7px', fontWeight:500 }}>#{h}</span>
        ))}
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:10 }}>
        <span style={{ fontSize:10, color: hashRangeOk ? T.textSub : T.errorText, fontWeight:600 }}>
          {hashCount} hashtags {hashRangeOk ? '✓' : (isIg ? '⚠ attendu 8-10' : '⚠ attendu 5')}
        </span>
        <button onClick={() => onCopy(platform)} className="hover-scale" style={{ marginLeft:'auto', padding:'7px 14px', borderRadius:10, fontFamily:'inherit', border:`1px solid ${copied===platform ? T.accentBorder : T.border}`, background: copied===platform ? T.chipActive : T.chipBg, color: copied===platform ? T.accentSoft : T.text, fontSize:12, fontWeight:600, cursor:'pointer' }}>
          {copied===platform ? '✓ Copié' : `Copier ${isIg?'IG':'FB'}`}
        </button>
      </div>
    </div>
  );
}

// ─── ERROR BANNER ────────────────────────────────────────────────────────────
function ErrorBanner({ T, message }) {
  if (!message) return null;
  return (
    <div style={{ background:T.errorBg, border:`1px solid ${T.errorBorder}`, borderRadius:12, padding:'10px 14px', display:'flex', gap:10, alignItems:'flex-start' }}>
      <span style={{ fontSize:16, lineHeight:1.2 }}>⚠️</span>
      <div style={{ flex:1, minWidth:0 }}>
        <p style={{ fontSize:13, color:T.errorText, fontWeight:600, marginBottom:2 }}>Génération échouée — affichage du fallback hors-ligne</p>
        <p style={{ fontSize:11, color:T.errorText, opacity:0.85, lineHeight:1.45, wordBreak:'break-word' }}>{message}</p>
        <p style={{ fontSize:11, color:T.errorText, opacity:0.7, marginTop:4 }}>Vérifie <code>GEMINI_API_KEY</code> côté Netlify, ou ouvre la console (F12) pour voir le détail brut.</p>
      </div>
    </div>
  );
}

// ─── CREATE SCREEN ───────────────────────────────────────────────────────────
function CreateScreen({ T, brand, generatedPost, setGeneratedPost, imagePreview, setImagePreview, onGoPreview }) {
  const [mode, setMode]       = React.useState('text');
  const [idea, setIdea]       = React.useState('');
  const [pillar, setPillar]   = React.useState(PILLARS[0].id);
  const [loading, setLoading] = React.useState(false);
  const [result, setResult]   = React.useState(generatedPost);
  const [copied, setCopied]   = React.useState(null);
  const [error, setError]     = React.useState(null);
  const fileRef = React.useRef(null);

  const handleImage = e => {
    const f = e.target.files[0];
    if (f) setImagePreview(URL.createObjectURL(f));
  };

  const handleGenerate = async () => {
    setLoading(true);
    setResult(null);
    setError(null);
    const prompt = buildAIPrompt(pillar, idea, brand);

    try {
      let raw;
      if (typeof window.claude?.complete === 'function') {
        raw = await window.claude.complete(prompt);
      } else {
        const r = await fetch('/api/claude', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const j = await r.json();
        if (!r.ok || j.error) {
          const detail = j.detail?.error?.message || j.detail?.message || JSON.stringify(j.detail || {});
          throw new Error(`${j.error || 'HTTP '+r.status} — ${detail}`);
        }
        raw = j.text;
      }
      const cleaned = raw.trim().replace(/^```json?\s*/i, '').replace(/```\s*$/, '');
      const data    = JSON.parse(cleaned);
      if (!data.instagram || !data.facebook) {
        throw new Error('Réponse IA mal formée (manque instagram ou facebook)');
      }
      // Garde-fou : impose le format final (signature + URL cliquable à la ligne)
      data.instagram.caption = normalizeCaption(data.instagram.caption, brand);
      data.facebook.caption  = normalizeCaption(data.facebook.caption,  brand);
      setResult(data);
      setGeneratedPost(data);
    } catch (e) {
      console.error('[Jamann] Génération IA échouée :', e);
      const activePillar = PILLARS.find(p => p.id === pillar) || PILLARS[0];
      const fallback = {
        instagram: {
          caption: normalizeCaption(`Au Col de Jaman, le temps ralentit.\nLe Manoïre se prépare. 🏔️\nFin juin 2026, on vous attend.`, brand),
          hashtags: [...brand.baseHashtags, ...activePillar.hashtags, 'Suisse', 'Alpes'],
        },
        facebook: {
          caption: normalizeCaption(`Il y a des lieux qui se redressent en silence.\nLe Manoïre est de ceux-là — 1512m d'altitude, la vue sur les Alpes, et bientôt les portes qui s'ouvrent.\nRendez-vous fin juin 2026.`, brand),
          hashtags: [...brand.baseHashtags, ...activePillar.hashtags.slice(0,2)],
        },
        visual_tip: 'Lumière naturelle de fin de journée, cadrage large sur le lieu.',
      };
      setResult(fallback);
      setGeneratedPost(fallback);
      setError(String(e.message || e));
    }
    setLoading(false);
  };

  const handleCopy = (platform) => {
    const data = result?.[platform];
    if (!data) return;
    const cap  = data.caption || '';
    const tags = (data.hashtags || []).map(h => `#${String(h).replace(/^#+/, '')}`).join(' ');
    const text = platform === 'instagram'
      ? `${cap}\n.\n.\n.\n${tags}`
      : (tags ? `${cap}\n\n${tags}` : cap);
    navigator.clipboard?.writeText(text).catch(() => {});
    setCopied(platform);
    setTimeout(() => setCopied(null), 2400);
  };

  const desktop = useIsDesktop();

  return (
    <div style={{ background:T.bg, display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{ padding:'18px 20px 0' }}>
        <p className="font-fraunces" style={{ fontSize:28, fontWeight:700, color:T.text, letterSpacing:'-0.5px' }}>Nouveau post <span style={{fontSize:20}}>✦</span></p>
        <p style={{ fontSize:13, color:T.textSub, marginTop:4 }}>1 clic = 2 versions (Instagram + Facebook) côte à côte</p>

        {/* Brand badge */}
        <div style={{ display:'flex', alignItems:'center', gap:7, padding:'7px 12px', marginTop:12, background:T.accentBg, borderRadius:10, border:`1px solid ${T.accentBorder}` }}>
          <span style={{ fontSize:14 }}>✦</span>
          <p style={{ fontSize:12, color:T.accentSoft, fontWeight:500 }}>
            App dédiée à <strong>{brand.name}</strong> — {brand.tagline}
          </p>
        </div>
      </div>

      {/* Body */}
      <div style={{ padding:'16px 18px 24px', display:'flex', flexDirection:'column', gap:16 }}>

        {/* Pillar selector */}
        <div>
          <p style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:10 }}>Pilier éditorial</p>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
            {PILLARS.map(p => {
              const on = pillar === p.id;
              return (
                <button key={p.id} onClick={() => setPillar(p.id)} title={p.angle} style={{ padding:'12px 6px', borderRadius:12, fontFamily:'inherit', border:`1px solid ${on ? T.accentBorder : T.border}`, background: on ? T.chipActive : T.chipBg, color: on ? T.accentSoft : T.textSub, fontSize:11, fontWeight:600, cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:5, lineHeight:1.25, textAlign:'center', transition:'all 0.15s' }}>
                  <span style={{fontSize:20}}>{p.emoji}</span>
                  {p.label}
                </button>
              );
            })}
          </div>
        </div>

        {/* Input card */}
        <div style={{ background:T.surface, borderRadius:20, padding:14, border:`1px solid ${T.border}` }}>
          <div style={{ display:'flex', gap:4, background:T.surface2, borderRadius:12, padding:3, marginBottom:12 }}>
            {[{id:'text',l:'💬 Idée (optionnel)'},{id:'image',l:'📸 Photo'}].map(m => (
              <button key={m.id} onClick={() => setMode(m.id)} style={{ flex:1, padding:'7px 0', textAlign:'center', fontFamily:'inherit', fontSize:13, fontWeight:600, borderRadius:9, border:'none', cursor:'pointer', background: mode===m.id ? T.surface : 'transparent', color: mode===m.id ? T.text : T.textSub, boxShadow: mode===m.id ? '0 1px 3px rgba(0,0,0,0.15)' : 'none', transition:'all 0.15s' }}>{m.l}</button>
            ))}
          </div>
          {mode === 'text' ? (
            <textarea value={idea} onChange={e => setIdea(e.target.value)}
              placeholder="Optionnel — précise l'angle si tu as une idée précise (ex: semaine 3 de travaux, on a démoli le mur du fond / Anouck a piqué un croissant au maçon / le fromager d'Ormonts vient livrer demain). Sinon, laisse vide et le pilier suffit."
              style={{ width:'100%', minHeight:96, background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:12, padding:'11px 13px', color:T.text, fontSize:14, lineHeight:1.55, resize:'none', fontFamily:'inherit' }}
            />
          ) : (
            <>
              <div onClick={() => fileRef.current?.click()} style={{ height:120, background:T.inputBg, border:`1.5px dashed ${T.border}`, borderRadius:12, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8, cursor:'pointer', overflow:'hidden', position:'relative' }}>
                {imagePreview
                  ? <img src={imagePreview} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                  : <><span style={{fontSize:30}}>📎</span><p style={{fontSize:13,color:T.textSub}}>Appuyez pour ajouter une photo</p></>
                }
                <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImage} />
              </div>
              <textarea value={idea} onChange={e => setIdea(e.target.value)} placeholder="Contexte (optionnel)…" style={{ width:'100%', minHeight:56, marginTop:10, background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:12, padding:'10px 13px', color:T.text, fontSize:13, lineHeight:1.5, resize:'none', fontFamily:'inherit' }} />
            </>
          )}
        </div>

        {/* Rules hint */}
        <div style={{ padding:'9px 13px', borderRadius:11, background:T.surface, border:`1px solid ${T.border}` }}>
          <p style={{ fontSize:12, color:T.textSub, lineHeight:1.55 }}>
            📸 IG : 200-350 caractères · 8-10 hashtags<br/>
            👥 FB : 300-500 caractères · 5 hashtags exact
          </p>
        </div>

        {/* Generate */}
        <button onClick={handleGenerate} disabled={loading} className={loading ? "" : "hover-scale"} style={{ width:'100%', padding:'15px', borderRadius:16, border:'none', background: loading ? T.surface2 : T.btnGrad, color: loading ? T.textMuted : T.btnText, fontSize:16, fontWeight:700, cursor: loading ? 'default' : 'pointer', fontFamily:'inherit', transition:'opacity 0.15s' }}>
          ✦ Générer les 2 posts
        </button>

        {loading && <Spinner T={T} />}

        {/* Error banner (always above results if any) */}
        {!loading && error && <ErrorBanner T={T} message={error} />}

        {/* Results — 2 cards side by side */}
        {!loading && result && (
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            <div style={{ display:'flex', gap:12, flexDirection: desktop ? 'row' : 'column' }}>
              <PostCard T={T} platform="instagram" data={result.instagram} brand={brand} copied={copied} onCopy={handleCopy} />
              <PostCard T={T} platform="facebook"  data={result.facebook}  brand={brand} copied={copied} onCopy={handleCopy} />
            </div>
            {result.visual_tip && (
              <p style={{ fontSize:12, color:T.textSub, fontStyle:'italic', lineHeight:1.5, padding:'10px 14px', background:T.surface, borderRadius:11, border:`1px solid ${T.border}` }}>
                💡 {result.visual_tip}
              </p>
            )}
            <button onClick={onGoPreview} style={{ padding:'11px', borderRadius:12, fontFamily:'inherit', border:'none', background:T.btnGrad, color:T.btnText, fontSize:13, fontWeight:700, cursor:'pointer' }}>
              Aperçu sur mockup →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CALENDAR SCREEN ─────────────────────────────────────────────────────────
function CalendarScreen({ T, onNewPost }) {
  const [selected, setSelected] = React.useState(null);
  const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const DAYS   = ['L','M','M','J','V','S','D'];
  const now    = new Date();
  const m = now.getMonth(), y = now.getFullYear(), today = now.getDate();
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInM  = new Date(y,m+1,0).getDate();
  const cells    = [...Array(firstDow).fill(null), ...Array.from({length:daysInM},(_,i)=>i+1)];
  const postMap  = Object.fromEntries(SAMPLE_POSTS.map(p=>[p.day,p]));
  const platC    = p => p==='instagram' ? T.accent : (T.id==='light'?'#1877F2':'#6BA8FF');

  return (
    <div style={{ background:T.bg, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'18px 20px 12px' }}>
        <p className="font-fraunces" style={{ fontSize:26, fontWeight:700, color:T.text }}>Calendrier</p>
        <p style={{ fontSize:13, color:T.textSub, marginTop:3 }}>Vue d'ensemble des publications planifiées</p>
      </div>
      {/* Bannière démo */}
      <div style={{ margin:'0 16px 14px', padding:'10px 14px', background:T.surface, borderRadius:12, border:`1px dashed ${T.accentBorder}`, display:'flex', gap:10, alignItems:'flex-start' }}>
        <span style={{ fontSize:16, lineHeight:1.2 }}>🚧</span>
        <div style={{ flex:1 }}>
          <p style={{ fontSize:12, color:T.accentSoft, fontWeight:600 }}>Module en démo</p>
          <p style={{ fontSize:11, color:T.textSub, marginTop:2, lineHeight:1.45 }}>
            Les posts ci-dessous sont des exemples. Le calendrier sera connecté à ton Airtable (table <code>tblqLY0hmMINANI9s</code>) plus tard, pour piloter le scénario Make 5469302 de publication automatique.
          </p>
        </div>
      </div>
      <div style={{ padding:'0 16px 24px' }}>
        <div style={{ background:T.surface, borderRadius:20, padding:'14px 12px', border:`1px solid ${T.border}`, marginBottom:16 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 4px', marginBottom:14 }}>
            <button style={{ width:30, height:30, borderRadius:'50%', background:T.chipBg, border:`1px solid ${T.border}`, color:T.textSub, fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>
            <span style={{ fontSize:15, fontWeight:700, color:T.text }}>{MONTHS[m]} {y}</span>
            <button style={{ width:30, height:30, borderRadius:'50%', background:T.chipBg, border:`1px solid ${T.border}`, color:T.textSub, fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:6 }}>
            {DAYS.map((d,i) => <div key={i} style={{ textAlign:'center', fontSize:11, fontWeight:700, color:T.textMuted, padding:'2px 0' }}>{d}</div>)}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
            {cells.map((d,i) => {
              const isT = d===today, post=d?postMap[d]:null, sel=d===selected;
              return (
                <div key={i} onClick={() => d && setSelected(sel?null:d)} style={{ aspectRatio:'1', borderRadius:9, cursor:d?'pointer':'default', background: sel?T.accent:isT?T.accentBg:'transparent', border:`1px solid ${isT&&!sel?T.accentBorder:'transparent'}`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:3 }}>
                  {d && <span style={{ fontSize:12, fontWeight:isT||sel?700:400, color:sel?'#fff':isT?T.accentSoft:T.text }}>{d}</span>}
                  {post && <div style={{ width:5, height:5, borderRadius:'50%', background:sel?'rgba(255,255,255,0.8)':platC(post.platform) }} />}
                </div>
              );
            })}
          </div>
        </div>
        <p style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:10 }}>Posts planifiés (exemples)</p>
        {SAMPLE_POSTS.map((p,i) => (
          <div key={i} onClick={() => setSelected(p.day===selected?null:p.day)} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px', background:selected===p.day?T.chipActive:T.surface, borderRadius:16, marginBottom:8, border:`1px solid ${selected===p.day?T.accentBorder:T.border}`, cursor:'pointer' }}>
            <div style={{ width:40, height:40, borderRadius:12, background:T.surface2, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <span style={{fontSize:14,fontWeight:700,color:T.text,lineHeight:1}}>{p.day}</span>
              <span style={{fontSize:10,color:T.textMuted}}>{MONTHS[m].slice(0,3)}</span>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:13,fontWeight:600,color:T.text}}>{p.label}</p>
              <p style={{fontSize:11,color:platC(p.platform),fontWeight:500,marginTop:2}}>{p.platform==='instagram'?'📸 Instagram':'👥 Facebook'}</p>
            </div>
            <div style={{width:8,height:8,borderRadius:'50%',background:platC(p.platform),flexShrink:0}} />
          </div>
        ))}
        <button onClick={onNewPost} style={{ width:'100%', padding:'13px', borderRadius:14, border:`1.5px dashed ${T.accentBorder}`, background:T.chipActive, color:T.accentSoft, fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:'inherit', marginTop:4 }}>
          ✦ Générer un nouveau post
        </button>
      </div>
    </div>
  );
}

// ─── TAB BAR / SIDEBAR ───────────────────────────────────────────────────────
function TabBar({ T, active, setActive }) {
  const desktop = useIsDesktop();
  const tabs = [
    { id:'create',   l:'Créer',
      icon: a => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?T.accent:T.textSub} strokeWidth="2.2" strokeLinecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> },
    { id:'preview',  l:'Aperçu',
      icon: a => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?T.accent:T.textSub} strokeWidth="2.2" strokeLinecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> },
    { id:'calendar', l:'Planning',
      icon: a => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?T.accent:T.textSub} strokeWidth="2.2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> },
    { id:'profile',  l:'Marque',
      icon: a => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?T.accent:T.textSub} strokeWidth="2.2" strokeLinecap="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9z"/></svg> },
  ];

  if (desktop) {
    return (
      <aside className="glass-surface" style={{ position:'fixed', top:0, bottom:0, left:0, width:240, zIndex:30, borderRight:`1px solid ${T.tabBorder}`, display:'flex', flexDirection:'column', padding:'30px 14px 24px' }}>
        <div style={{ padding:'0 12px 22px', borderBottom:`1px solid ${T.border}`, marginBottom:14 }}>
          <img src="logo.png" alt="Logo Le Manoïre" style={{ width: '100%', maxWidth: 100, marginBottom: 16, display: 'block' }} />
          <p className="font-fraunces" style={{ fontSize:26, fontWeight:700, color:T.text, letterSpacing:'-0.5px' }}>Jamann <span style={{color:T.accent}}>✦</span></p>
          <p style={{ fontSize:12, color:T.textSub, marginTop:2 }}>Posts IA · Le Manoïre</p>
        </div>
        {tabs.map(tab => {
          const on = active === tab.id;
          return (
            <button key={tab.id} onClick={() => setActive(tab.id)} style={{ background: on ? T.chipActive : 'transparent', border:`1px solid ${on ? T.accentBorder : 'transparent'}`, cursor:'pointer', display:'flex', flexDirection:'row', alignItems:'center', gap:12, padding:'11px 14px', borderRadius:12, marginBottom:4, width:'100%', textAlign:'left', fontFamily:'inherit', transition:'all 0.15s' }}>
              {tab.icon(on)}
              <span style={{ fontSize:14, fontWeight:600, color: on ? T.accent : T.text }}>{tab.l}</span>
            </button>
          );
        })}
        {/* Footer crédit */}
        <div style={{ marginTop:'auto', padding:'14px 12px 4px', borderTop:`1px solid ${T.border}` }}>
          <p style={{ fontSize:11, color:T.textMuted, lineHeight:1.5 }}>© 2026 · Conçu par<br/><span className="font-caveat" style={{ color:T.textSub, fontSize:18, fontWeight:500 }}>L'Atelier des Automates</span><br/><span style={{ color:T.textMuted, fontSize:10 }}>by Clockwork Ops</span></p>
        </div>
      </aside>
    );
  }

  return (
    <nav style={{ position:'fixed', bottom:0, left:0, right:0, zIndex:30, background:T.tabBg, borderTop:`1px solid ${T.tabBorder}`, backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)', display:'flex', justifyContent:'space-around', padding:'8px 0 22px' }}>
      {tabs.map(tab => (
        <button key={tab.id} onClick={() => setActive(tab.id)} style={{ background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'4px 12px', fontFamily:'inherit' }}>
          {tab.icon(active===tab.id)}
          <span style={{ fontSize:10, fontWeight:600, color: active===tab.id ? T.accent : T.textSub }}>{tab.l}</span>
        </button>
      ))}
    </nav>
  );
}

// ─── MOBILE HEADER ────────────────────────────────────────────────────────────
function MobileHeader({ T }) {
  return (
    <div className="glass-surface fade-in" style={{ position:'sticky', top:0, zIndex:20, display:'flex', alignItems:'center', justifyContent:'center', padding:'12px 16px', borderBottom:`1px solid ${T.tabBorder}`, borderRadius:'0 0 20px 20px', marginBottom:16 }}>
      <img src="logo.png" alt="Logo Le Manoïre" style={{ height: 42, width:'auto', marginRight: 12 }} />
      <div style={{ display:'flex', flexDirection:'column' }}>
        <p className="font-fraunces" style={{ fontSize:22, fontWeight:700, color:T.text, letterSpacing:'-0.5px', lineHeight:1.1 }}>Jamann <span style={{color:T.accent}}>✦</span></p>
        <p style={{ fontSize:11, color:T.textSub }}>Posts IA · Le Manoïre</p>
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function JamannApp() {
  const T                       = THEMES.manoire;
  const desktop                 = useIsDesktop();
  const [tab, setTab]           = React.useState('create');
  const [post, setPost]         = React.useState(null);
  const [imgPrev, setImgPrev]   = React.useState(null);

  const shared = { T, brand:BRAND, generatedPost:post, setGeneratedPost:setPost, imagePreview:imgPrev, setImagePreview:setImgPrev };

  return (
    <div style={{ width:'100%', minHeight:'100vh', background:T.pageBg, fontFamily:"'DM Sans', sans-serif", WebkitFontSmoothing:'antialiased' }}>
      {!desktop && <MobileHeader T={T} />}
      <main className="fade-in" style={{
        paddingLeft: desktop ? 240 : 0,
        paddingBottom: desktop ? 40 : 90,
        paddingTop: desktop ? 40 : 10,
        minHeight:'100vh',
      }}>
        <div style={{ maxWidth: 960, margin:'0 auto', padding: desktop ? '0 32px' : '0 16px' }}>
          {tab==='create'   && <div className="slide-up"><CreateScreen   {...shared} onGoPreview={()=>setTab('preview')} /></div>}
          {tab==='preview'  && <div className="slide-up"><PreviewScreen  {...shared} onSchedule={()=>setTab('calendar')} /></div>}
          {tab==='calendar' && <div className="slide-up"><CalendarScreen T={T} onNewPost={()=>setTab('create')} /></div>}
          {tab==='profile'  && <div className="slide-up"><ProfileScreen  T={T} brand={BRAND} /></div>}
        </div>
      </main>
      <TabBar T={T} active={tab} setActive={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<JamannApp />);
</script>
</body>
</html>
